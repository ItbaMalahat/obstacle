<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Obby World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3ecff; --card:#ffffff; --ink:#2b2150; --muted:#7a6f9b; --line:#e5dcfb;
  --pink:#ff5fa2; --purple:#7b3fe4; --teal:#21c7b5; --blue:#4fa3ff; --orange:#ff9f1c; --green:#3ec46d; --yellow:#ffd23f;
  --shadow:0 6px 0 rgba(60,30,120,.12), 0 12px 30px rgba(60,30,120,.10);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#1a1530; --card:#2a2348; --ink:#f4efff; --muted:#b7acd9; --line:#3d3466; }
}
:root[data-theme="dark"]{ --bg:#1a1530; --card:#2a2348; --ink:#f4efff; --muted:#b7acd9; --line:#3d3466; }
*{box-sizing:border-box}
html{background-color:var(--bg)}
html,body{margin:0;color:var(--ink);font-family:Fredoka,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
html{background-image:radial-gradient(circle at 10% 10%, rgba(255,95,162,.12), transparent 40%),radial-gradient(circle at 90% 20%, rgba(79,163,255,.12), transparent 40%);min-height:100vh}
button{font-family:inherit;cursor:pointer;color:inherit}
button:disabled{cursor:not-allowed;opacity:.5}
h1,h2,h3{margin:.2em 0}
.topbar{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:linear-gradient(90deg,var(--pink),var(--purple));color:#fff;box-shadow:0 4px 14px rgba(80,30,160,.3)}
.logo{background:none;border:0;color:#fff;font-size:22px;font-weight:700}
.pill{background:rgba(255,255,255,.22);padding:6px 14px;border-radius:999px;font-weight:600;font-size:17px}
#app{max-width:1060px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:18px;border:2px solid var(--line)}
.muted{color:var(--muted)}
.center{text-align:center}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.row.center{justify-content:center}
.btn{border:0;border-radius:16px;padding:12px 20px;font-size:17px;font-weight:600;background:var(--purple);color:#fff;box-shadow:0 4px 0 #4f22a6;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #4f22a6}
.btn.pink{background:var(--pink);box-shadow:0 4px 0 #c13576}
.btn.green{background:var(--green);box-shadow:0 4px 0 #24894a}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.small{padding:8px 14px;font-size:15px}
.btn.big{font-size:20px;padding:14px 26px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:16px;font-weight:600;z-index:50;box-shadow:var(--shadow);max-width:90vw;text-align:center}
/* pick */
.pick-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:18px}
.pick{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:16px;transition:transform .15s}
.pick:hover{transform:translateY(-4px)}
.big-plus{font-size:90px;height:150px;display:grid;place-items:center}
/* creator */
.creator{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
@media (max-width:760px){.creator{grid-template-columns:1fr}}
.preview{display:flex;flex-direction:column;align-items:center;gap:10px;position:sticky;top:74px}
.name-input{font-family:inherit;font-size:20px;padding:10px 14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);width:100%;text-align:center}
.field{margin-bottom:14px}
.field label{display:block;font-weight:600;margin-bottom:6px}
.swatches,.chips{display:flex;flex-wrap:wrap;gap:8px}
.swatch{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line)}
.swatch.on{box-shadow:0 0 0 3px var(--purple)}
.chip{border:2px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 13px;font-size:15px}
.chip.on{background:var(--purple);border-color:var(--purple);color:#fff}
/* hub */
.hero{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.hero h1{font-size:30px}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-top:18px}
.game-card{border:0;border-radius:24px;padding:20px;text-align:left;color:#fff;min-height:170px;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden;box-shadow:var(--shadow);transition:transform .15s}
.game-card:hover{transform:translateY(-4px) rotate(-.5deg)}
.game-card .num{position:absolute;top:14px;left:16px;background:rgba(255,255,255,.3);border-radius:999px;padding:2px 12px;font-weight:700}
.game-card .emo{position:absolute;top:8px;right:14px;font-size:64px}
.game-card h2{font-size:24px}
.game-card p{margin:0;opacity:.95}
.g1{background:linear-gradient(135deg,#ff7eb3,#ff5fa2 50%,#e0408a)}
.g2{background:linear-gradient(135deg,#6fb6ff,#4f7bff)}
.g3{background:linear-gradient(135deg,#5cd68a,#2f9e5c)}
.g4{background:linear-gradient(135deg,#ffb84f,#ff7b3a)}
.extras{display:flex;gap:12px;margin-top:16px;flex-wrap:wrap}
.extras .btn{flex:1;min-width:150px}
/* tabs */
.tabs{display:flex;gap:8px;margin:10px 0 14px;flex-wrap:wrap}
.tab{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:9px 16px;font-size:16px;font-weight:600}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* levels */
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.level{border:2px solid var(--line);background:var(--card);border-radius:18px;padding:16px;text-align:left;font-size:16px}
.level .e{font-size:34px}
.level.locked{opacity:.55}
/* play */
.canvas-wrap{position:relative;width:100%;border-radius:18px;overflow:hidden;box-shadow:var(--shadow);background:#8fd3ff;touch-action:none}
canvas.game{display:block;width:100%;height:auto;touch-action:none}
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(30,20,60,.45)}
.overlay .card{text-align:center;min-width:260px}
.earned{font-size:34px;font-weight:700;color:var(--orange);margin:6px 0}
.touch{display:none;justify-content:space-between;margin-top:12px;user-select:none}
.touch.on{display:flex}
.tbtn{width:78px;height:78px;border-radius:50%;border:0;font-size:32px;background:var(--card);box-shadow:var(--shadow);touch-action:none}
.tbtn.jump{background:var(--pink);color:#fff}
/* builders */
.builder{display:grid;grid-template-columns:1fr 260px;gap:14px;align-items:start}
.builder>div{min-width:0}
@media (max-width:820px){.builder{grid-template-columns:1fr}}
.scroll{overflow-x:auto;border-radius:16px;border:2px solid var(--line);background:#cfeeff;touch-action:pan-x}
.scroll canvas{display:block;touch-action:none}
.palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px}
.pal{border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:6px 4px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;line-height:1.1}
.pal.on{border-color:var(--purple);box-shadow:0 0 0 2px var(--purple)}
.pal.locked{opacity:.6}
.pal .price{font-size:11px;color:var(--orange);font-weight:700}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.stat{background:var(--bg);border-radius:12px;padding:6px 12px;font-weight:600}
.side h3{margin-top:0}
.meter{height:12px;border-radius:999px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--orange),var(--green))}
.people{display:flex;flex-direction:column;gap:8px;max-height:300px;overflow:auto}
.person{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:14px;padding:4px 8px;border:0;text-align:left;font-size:15px}
/* shop */
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.item{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.item .desc{font-size:13px;min-height:34px}
.item .emoji{font-size:48px;height:64px;display:grid;place-items:center}
.fun-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.hide-sm{}
@media (max-width:600px){.hide-sm{display:none}.hero h1{font-size:24px}}

/* ---- v2 polish ---- */
.top-r{display:flex;gap:8px;align-items:center}
.pill.lvl{position:relative;overflow:hidden;padding-bottom:9px}
.pill.lvl i{position:absolute;left:10px;bottom:4px;height:3px;border-radius:3px;background:#ffe066;max-width:calc(100% - 20px)}
.topbar{background:linear-gradient(90deg,#ff5fa2,#b14bf4 55%,#6a4cff)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.itm{position:relative;border:2px solid var(--line);background:linear-gradient(180deg,var(--card),var(--bg));border-radius:16px;padding:6px 4px 5px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;line-height:1.1;transition:transform .1s}
.itm:hover{transform:translateY(-2px)}
.itm.on{border-color:var(--pink);box-shadow:0 0 0 3px rgba(255,95,162,.35);background:linear-gradient(180deg,#fff,#ffe6f3)}
:root[data-theme="dark"] .itm.on{background:linear-gradient(180deg,#3a2a55,#4a2a55)}
.itm.locked canvas{filter:saturate(.35) opacity(.75)}
.itm .price{font-weight:700;color:var(--orange);font-size:11px}
.itm .nm{text-align:center}
.pv-stage{border-radius:24px;background:radial-gradient(circle at 50% 60%,#fff,#ffe1f2 60%,#e9dcff);box-shadow:inset 0 -6px 0 rgba(123,63,228,.08)}
.hero-stage{border-radius:50%;box-shadow:0 8px 24px rgba(255,95,162,.25)}
.lvcard{background:var(--bg);border-radius:16px;padding:12px;margin-top:6px}
.meter.big{height:16px;margin:8px 0}
.meter i{background:linear-gradient(90deg,#ffd23f,#ff9f1c,#ff5fa2);box-shadow:inset 0 -3px 0 rgba(0,0,0,.1)}
.game-card{box-shadow:0 8px 0 rgba(0,0,0,.12),0 16px 30px rgba(60,30,120,.18)}
.game-card::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 80% 10%,rgba(255,255,255,.35),transparent 45%);pointer-events:none}
.game-card .emo{filter:drop-shadow(0 6px 8px rgba(0,0,0,.2));animation:floaty 3s ease-in-out infinite}
.game-card:nth-child(2) .emo{animation-delay:-.7s}.game-card:nth-child(3) .emo{animation-delay:-1.4s}.game-card:nth-child(4) .emo{animation-delay:-2.1s}
@keyframes floaty{50%{transform:translateY(-8px) rotate(4deg)}}
.celebrate{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(30,15,60,.45);animation:fadein .2s}
.cel-card,.result-card{position:relative;overflow:hidden;background:var(--card);border-radius:26px;padding:26px 30px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:popin .35s cubic-bezier(.2,1.6,.4,1);max-width:90vw}
.cel-card h2{font-size:30px;background:linear-gradient(90deg,#ff5fa2,#7b3fe4);-webkit-background-clip:text;background-clip:text;color:transparent}
.cel-burst{position:absolute;inset:-50%;background:repeating-conic-gradient(rgba(255,210,63,.18) 0 10deg,transparent 10deg 20deg);animation:spin 12s linear infinite;pointer-events:none;z-index:0}
.cel-card>*:not(.cel-burst),.result-card>*:not(.cel-burst){position:relative;z-index:1}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes popin{from{transform:scale(.6);opacity:0}}
@keyframes fadein{from{opacity:0}}
.result-card .rows{display:flex;flex-direction:column;gap:4px;margin:10px auto;min-width:240px;text-align:left}
.result-card .rows div{display:flex;justify-content:space-between;gap:20px;background:var(--bg);border-radius:10px;padding:5px 10px}
.shop-h{margin:18px 0 8px}
.item.owned{opacity:.85}
.level{transition:transform .12s;box-shadow:0 4px 0 rgba(60,30,120,.08)}
.level:not(.locked):hover{transform:translateY(-3px)}

/* ---- v3 ---- */
#bgfx{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.sec{margin:22px 0 0;font-size:22px}
.games{margin-top:10px}
.g5{background:linear-gradient(135deg,#3fd0c9,#1f9fb5)}
.g6{background:linear-gradient(135deg,#8a7bff,#5b4ae0)}
.g7{background:linear-gradient(135deg,#ffcf4f,#f5a316)}
.g8{background:linear-gradient(135deg,#ff8fc7,#e9559e)}
.g9{background:linear-gradient(135deg,#7fd8ff,#3c9df0)}
.pill-dark{background:var(--ink);color:var(--bg);padding:6px 14px;border-radius:999px;font-weight:600}
.code-wrap{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start;margin-top:10px}
@media (max-width:860px){.code-wrap{grid-template-columns:1fr}}
.code-board{background:#7fd36f;max-width:640px}
.code-board.paper{background:#fffdf6;max-width:480px}
.helper{display:flex;align-items:flex-end;gap:8px;margin-top:10px}
.bubble{position:relative;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:10px 14px;font-size:17px;font-weight:500;box-shadow:var(--shadow);flex:1}
.bubble::before{content:"";position:absolute;left:-10px;bottom:14px;border:8px solid transparent;border-right-color:var(--line)}
.coder{display:flex;flex-direction:column;gap:10px}
.code-strip{min-height:84px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:repeating-linear-gradient(90deg,var(--bg) 0 18px,transparent 18px 20px);border:3px dashed var(--line);border-radius:18px;padding:10px}
.code-strip .empty{font-size:15px}
.code-strip .arrow{color:var(--muted);font-weight:700}
.cblock{position:relative;border:0;border-radius:14px;background:var(--c);color:#fff;min-width:58px;height:58px;padding:4px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 4px 0 rgba(0,0,0,.25);font-weight:700;transition:transform .08s}
.cblock:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.cblock .ic{font-size:26px;line-height:1}
.cblock .cnt{font-size:14px;background:rgba(0,0,0,.25);border-radius:8px;padding:0 6px;margin-top:2px}
.cblock .x{position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:50%;background:#2b2150;color:#fff;font-size:11px;display:grid;place-items:center;box-shadow:0 2px 4px rgba(0,0,0,.3)}
.cblock.big{min-width:84px;height:84px}
.cblock.big small{font-size:12px;margin-top:4px}
.code-pal{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:6px;background:var(--bg);border-radius:18px}
.loop-row{display:flex;gap:8px;align-items:center;justify-content:center;background:linear-gradient(90deg,#fff3c4,#ffe0f0);color:#2b2150;border-radius:16px;padding:8px;font-weight:600}
.loop-row b{font-size:24px;min-width:28px;text-align:center}
.busy{opacity:.6;pointer-events:none}
.small-tip{font-size:13px}
.go{width:100%}
.code-levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:12px}
.clevel{border:0;border-radius:20px;padding:14px;background:linear-gradient(160deg,#3fd0c9,#1f9fb5);color:#fff;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 5px 0 rgba(0,0,0,.15);transition:transform .12s}
.clevel:not(.locked):hover{transform:translateY(-3px) rotate(-1deg)}
.clevel.locked{background:linear-gradient(160deg,#c9c3dd,#a9a2c2)}
.clevel .n{font-size:30px;font-weight:700;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center}
.clevel .nm{font-weight:600;text-align:center}
.clevel .st{letter-spacing:2px}
.big-stars{font-size:46px;letter-spacing:6px;margin:6px 0}
.big-stars .dim{filter:grayscale(1);opacity:.3}
.mem-modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-top:14px}
.mem-grid{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:12px;max-width:640px;margin:16px auto 0}
.mcard{aspect-ratio:3/4;border:0;background:none;padding:0;perspective:700px}
.mi{position:relative;width:100%;height:100%;transition:transform .45s cubic-bezier(.3,1.4,.5,1);transform-style:preserve-3d}
.mcard.flip .mi,.mcard.done .mi{transform:rotateY(180deg)}
.mf{position:absolute;inset:0;border-radius:16px;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 5px 0 rgba(60,30,120,.15)}
.mf.back{background:linear-gradient(135deg,#ff7eb3,#7b3fe4);color:rgba(255,255,255,.7);font-size:30px;border:3px solid rgba(255,255,255,.5)}
.mf.back::after{content:"";position:absolute;inset:8px;border:2px dashed rgba(255,255,255,.35);border-radius:10px}
.mf.front{background:#fff;transform:rotateY(180deg);font-size:clamp(28px,7vw,52px);border:3px solid var(--line)}
.mcard.done .mf.front{border-color:#3ec46d;box-shadow:0 0 0 4px rgba(62,196,109,.3);animation:popin .4s}

/* ---- v4 polish ---- */
.game-card{min-height:200px}
.game-card .scene{position:absolute;top:8px;right:8px;pointer-events:none;filter:drop-shadow(0 6px 8px rgba(0,0,0,.18))}
.game-card h2,.game-card p{position:relative;z-index:1;text-shadow:0 2px 6px rgba(0,0,0,.18)}
.btn:not(.ghost){background-image:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0) 55%)}
.card{background-image:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0) 120px)}
:root[data-theme="dark"] .card{background-image:none}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .card{background-image:none} }
.canvas-wrap{box-shadow:0 10px 0 rgba(60,30,120,.10),0 20px 40px rgba(60,30,120,.22);border:3px solid rgba(255,255,255,.7)}
.topbar{box-shadow:0 6px 20px rgba(120,40,200,.35)}
.logo{text-shadow:0 2px 0 rgba(0,0,0,.15)}
</style>
</head>
<body>
<canvas id="bgfx" aria-hidden="true"></canvas>
<header class="topbar">
  <button class="logo" id="homeBtn">🧱 Obby World</button>
  <span class="top-r"><span class="pill lvl" id="lvl" title="Your level"></span><span class="pill" id="coins" title="Coins">🪙 0</span></span>
</header>
<main id="app"></main>
<div id="toastBox"></div>

<script>
'use strict';
/* =========================================================
   DATA
   ========================================================= */
const TILE = 40, ROWS = 12;

const BLOCKS = {
  '#': { name:'Grass', price:0, solid:true, color:'#4cbf5a', desc:'The classic block.' },
  'S': { name:'Stone', price:0, solid:true, color:'#8d93a8', desc:'Strong and grey.' },
  'W': { name:'Wood', price:0, solid:true, color:'#c98a4b', desc:'Cosy wooden planks.' },
  'T': { name:'Brick', price:0, solid:true, color:'#d0573f', desc:'Build a wall!' },
  'A': { name:'Sand', price:0, solid:true, color:'#f0cf86', desc:'Beachy vibes.' },
  'L': { name:'Lava', price:0, hazard:true, color:'#ff5a36', desc:'Touch it and you respawn!' },
  'X': { name:'Spikes', price:0, hazard:true, spike:true, color:'#c9ced9', desc:'Ouch! Jump over them.' },
  'C': { name:'Coin', price:0, collect:1, color:'#ffd23f', desc:'Worth 1 coin.' },
  'P': { name:'Start', price:0, spawn:true, color:'#4fa3ff', desc:'Where you appear.' },
  'G': { name:'Goal', price:0, goal:true, color:'#ff6fb5', desc:'Reach it to win!' },
  'N': { name:'Snow', price:40, solid:true, bonus:1, color:'#eaf6ff', desc:'Soft and fluffy.' },
  'U': { name:'Cloud', price:60, oneway:true, bonus:1, desc:'Jump up through it, land on top.' },
  'I': { name:'Ice', price:70, solid:true, ice:true, bonus:1, color:'#8fe3ff', desc:'Slippery and shiny.' },
  'J': { name:'Jump Pad', price:80, solid:true, bounce:1080, bonus:2, color:'#a45cff', desc:'Launches you super high!' },
  'Q': { name:'Glass', price:80, solid:true, bonus:1, color:'#bfefff', desc:'See-through and sparkly.' },
  'K': { name:'Checkpoint', price:90, checkpoint:true, bonus:2, color:'#3ddc97', desc:'Respawn here instead of the start.' },
  'H': { name:'Honey', price:90, solid:true, honey:true, bonus:1, color:'#ffb627', desc:'Sticky! Slows you down.' },
  'V': { name:'Vanish Block', price:110, solid:true, vanish:true, bonus:2, color:'#c77dff', desc:'Disappears after you step on it!' },

function buildLevel(width, ops){
  const g = Array.from({length:ROWS}, () => Array(width).fill('.'));
  for (const [ch,x,y,w=1,h=1] of ops)
    for (let yy=y; yy<y+h; yy++) for (let xx=x; xx<x+w; xx++)
      if (yy>=0 && yy<ROWS && xx>=0 && xx<width) g[yy][xx]=ch;
  return g.map(r=>r.join(''));
}

  const old = { cat:'hat:cat', star:'hat:star', crown:'hat:crown', cape:'back:cape', sparkle:'trail:sparkle' };
  S.owned.style = (S.owned.style||[]).map(id => id.includes(':') ? id : (old[id] || 'hat:'+id));
  if (S.avatar){
    S.avatar = { ...DEFAULT_AV, ...S.avatar };
    if (S.cape && S.avatar.back==='none') S.avatar.back='cape';
    if (S.trail && S.avatar.trail==='none') S.avatar.trail='sparkle';
  }
  delete S.cape; delete S.trail;
  if (S.forest) S.forest.people = S.forest.people.map(p => ({ ...DEFAULT_AV, ...p }));
})();

// ---- "the more you play, the more coins you get" ----
const xpNeed = l => 60 + l * 40;
const coinBoost = () => Math.min(2, 1 + (S.level - 1) * 0.05); // +5% coins per level, up to double
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} refreshCoins(); }
function refreshCoins(){
  document.getElementById('coins').textContent = '🪙 ' + S.coins;
  const lv = document.getElementById('lvl');
  if (lv) lv.innerHTML = `⭐ Lv ${S.level}<i style="width:${Math.round(S.xp / xpNeed(S.level) * 100)}%"></i>`;
}
function addCoins(n){ S.coins += n; save(); }
// Earn coins from playing: boosted by your level, and gives XP.
function earn(base, xp = base){
  const c = Math.max(1, Math.round(base * coinBoost()));
  S.coins += c; S.totalEarned += c;
  gainXP(xp);
  save();
  return c;
}
function gainXP(n){
  S.xp += Math.round(n);
  while (S.xp >= xpNeed(S.level)){
    S.xp -= xpNeed(S.level); S.level++;
    const bonus = S.level * 15;
    S.coins += bonus;
    const lvl = S.level;
    setTimeout(() => celebrate(`⭐ LEVEL ${lvl}! ⭐`, `+${bonus} 🪙 · Coin boost now +${Math.round((coinBoost()-1)*100)}%`), 700);
  }
}
function dailyBonus(){
  const today = new Date().toDateString();
  if (S.daily.last === today) return;
  const yest = new Date(Date.now() - 864e5).toDateString();
  S.daily.streak = S.daily.last === yest ? S.daily.streak + 1 : 1;
  S.daily.last = today;
  const got = earn(20 + Math.min(7, S.daily.streak) * 10, 20);
  setTimeout(() => celebrate(`🎁 Daily Bonus · Day ${S.daily.streak}`, `+${got} 🪙 — come back tomorrow for even more!`), 400);
}
// Every 2 minutes of playing any game pays a reward.
let currentScreen = '';
setInterval(() => {
  if (document.hidden || !['play','builder','city','forest','fun','codeplay','art','memory','catcher','balloon'].includes(currentScreen)) return;
  S.playSec++;
  if (S.playSec % 120 === 0){ const got = earn(6, 15); toast(`🎮 +${got} 🪙 for playing 2 more minutes!`); }
}, 1000);
function celebrate(title, sub){
  const d = document.createElement('div');
  d.className = 'celebrate';
  d.innerHTML = `<div class="cel-card"><div class="cel-burst"></div><h2>${title}</h2><p>${sub}</p><button class="btn pink">Yay! 🎉</button></div>`;
  d.querySelector('button').onclick = () => d.remove();
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 6000);
}

const CATS = { blocks:BLOCKS, city:CITY, forest:FOREST };
function owns(cat,id){ const it = CATS[cat][id]; return !!it && (!it.price || S.owned[cat].includes(id)); }

function toast(msg){
  const box = document.getElementById('toastBox');
  box.innerHTML = `<div class="toast" role="status">${msg}</div>`;
  clearTimeout(toast.t); toast.t = setTimeout(()=> box.innerHTML='', 2600);
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* =========================================================
   DRAWING
   ========================================================= */
function rr(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function shade(hex,amt){ const n=parseInt(hex.slice(1),16); const c=v=>Math.max(0,Math.min(255,v+amt)); return `rgb(${c(n>>16)},${c((n>>8)&255)},${c(n&255)})`; }
function star(ctx,x,y,r,color){ ctx.fillStyle=color; ctx.beginPath(); for(let i=0;i<10;i++){ const rad=i%2?r*.45:r, a=-Math.PI/2+i*Math.PI/5; ctx.lineTo(x+Math.cos(a)*rad,y+Math.sin(a)*rad);} ctx.closePath(); ctx.fill(); }

// Chibi character. (cx, footY) = bottom centre; ~46px tall at scale 1.
function heartPath(ctx,x,y,s){ ctx.beginPath(); ctx.moveTo(x,y+s*.35); ctx.bezierCurveTo(x,y-s*.1,x-s*.6,y-s*.1,x-s*.6,y+s*.3); ctx.bezierCurveTo(x-s*.6,y+s*.6,x,y+s*.8,x,y+s); ctx.bezierCurveTo(x,y+s*.8,x+s*.6,y+s*.6,x+s*.6,y+s*.3); ctx.bezierCurveTo(x+s*.6,y-s*.1,x,y-s*.1,x,y+s*.35); ctx.closePath(); }
function drawAvatar(ctx,cx,footY,av,o={}){
  const a = { ...DEFAULT_AV, ...av };
  const { scale=1, facing=1, walk=0, arms=false, t=performance.now()/1000, shadow=true } = o;
  ctx.save(); ctx.translate(cx,footY); ctx.scale(scale,scale); ctx.lineJoin='round'; ctx.lineCap='round';
  const sw = Math.sin(walk)*.6, hy=-33, hr=12.5, look=facing*1.8;
  const P = (col,lw=1.1) => { const g=ctx.createLinearGradient(-8,-54,6,2); g.addColorStop(0,shade(col,34)); g.addColorStop(.55,col); g.addColorStop(1,shade(col,-30)); ctx.fillStyle=g; ctx.strokeStyle=shade(col,-80); ctx.lineWidth=lw; };
  const FS = () => { ctx.fill(); ctx.stroke(); };
  const air = arms;

  if (shadow){ ctx.fillStyle='rgba(0,0,0,.2)'; ctx.beginPath(); ctx.ellipse(0,0,12,3.2,0,0,7); ctx.fill(); }

  // ---------- back items ----------
  const flap = Math.sin(t*(air?18:6))*.25;
  if (a.back==='cape'){
    const g=ctx.createLinearGradient(0,-24,0,-2); g.addColorStop(0,'#ff4d5e'); g.addColorStop(1,'#b81d3a');
    ctx.fillStyle=g; ctx.strokeStyle='#7d1028'; ctx.lineWidth=1;
    const wv=Math.sin(t*6+walk)*2;
    ctx.beginPath(); ctx.moveTo(-6,-23); ctx.lineTo(6,-23); ctx.quadraticCurveTo(10-facing*5,-12,9-facing*7,-2+wv); ctx.lineTo(-9-facing*7,-2-wv); ctx.quadraticCurveTo(-10-facing*5,-12,-6,-23); FS();
  } else if (['fairy','butterfly','angel'].includes(a.back)){
    for (const s of [-1,1]){
      ctx.save(); ctx.translate(s*4,-20); ctx.rotate(s*(.35+flap));
      if (a.back==='fairy'){
        ctx.fillStyle='rgba(170,240,255,.65)'; ctx.strokeStyle='rgba(90,170,220,.9)'; ctx.lineWidth=1;
        ctx.beginPath(); ctx.ellipse(s*10,-6,11,6,s*-.5,0,7); FS(); ctx.beginPath(); ctx.ellipse(s*8,5,7,4,s*.5,0,7); FS();
        ctx.fillStyle='rgba(255,255,255,.7)'; ctx.beginPath(); ctx.arc(s*12,-8,1.5,0,7); ctx.fill();
      } else if (a.back==='butterfly'){
        P('#ff8a3d'); ctx.beginPath(); ctx.ellipse(s*10,-6,11,8,s*-.4,0,7); FS(); P('#c86bff'); ctx.beginPath(); ctx.ellipse(s*8,6,7,5,s*.5,0,7); FS();
        ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(s*13,-8,2.2,0,7); ctx.arc(s*8,-3,1.4,0,7); ctx.fill();
      } else {
        P('#ffffff'); for (let i=0;i<3;i++){ ctx.beginPath(); ctx.ellipse(s*(6+i*4),-4+i*3,8-i,4,s*(-.6+i*.3),0,7); FS(); }
      }
      ctx.restore();
    }
  } else if (a.back==='bigbow'){
    P('#ff3d7f'); ctx.beginPath(); ctx.moveTo(0,-20); ctx.quadraticCurveTo(-16,-30,-15,-14); ctx.closePath(); FS(); ctx.beginPath(); ctx.moveTo(0,-20); ctx.quadraticCurveTo(16,-30,15,-14); ctx.closePath(); FS(); ctx.beginPath(); ctx.moveTo(-2,-19); ctx.lineTo(-7,-5); ctx.lineTo(-3,-7); ctx.closePath(); FS(); ctx.beginPath(); ctx.moveTo(2,-19); ctx.lineTo(7,-5); ctx.lineTo(3,-7); ctx.closePath(); FS();
  } else if (a.back==='dragonwings' || a.back==='rainbowwings'){
    for (const s of [-1,1]){ ctx.save(); ctx.translate(s*4,-21); ctx.rotate(s*(.25+flap));
      if (a.back==='dragonwings'){ P('#9b5cff'); ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(s*20,-14); ctx.lineTo(s*18,-4); ctx.lineTo(s*22,2); ctx.lineTo(s*15,4); ctx.lineTo(s*16,10); ctx.closePath(); FS(); ctx.strokeStyle='#5a2a9a'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(s*18,-4); ctx.moveTo(0,0); ctx.lineTo(s*15,4); ctx.stroke(); }
      else { ['#ff4d6d','#ff9f1c','#ffd23f','#5cc96b','#4fa3ff','#9b5cff'].forEach((c,i)=>{ ctx.fillStyle=c; ctx.beginPath(); ctx.ellipse(s*(9+i*.4),-4+i*1.6,15-i*1.6,9-i*1.2,s*-.4,0,7); ctx.fill(); }); }
      ctx.restore(); }
  } else if (a.back==='backpack'){
    P('#ff9f1c'); rr(ctx,-facing*11-6,-24,12,14,4); FS(); P('#ffd08a'); rr(ctx,-facing*11-4,-17,8,5,2); FS();
  } else if (a.back==='jetpack'){
    for (const s of [-1,1]){ P('#b8c0d0'); rr(ctx,-facing*9+s*4-3,-25,6,15,3); FS(); P('#ff5a36'); ctx.fillRect(-facing*9+s*4-3,-12,6,2); }
    if (air){ for (const s of [-1,1]){ const fl=6+Math.random()*6; ctx.fillStyle='#ffd23f'; ctx.beginPath(); ctx.moveTo(-facing*9+s*4-3,-10); ctx.lineTo(-facing*9+s*4,-10+fl); ctx.lineTo(-facing*9+s*4+3,-10); ctx.fill(); } }
  }

  // ---------- back hair ----------
  P(a.hairColor);
  const H=a.hair;
  if (H==='long'){ rr(ctx,-13.5,-40,27,30,9); FS(); }
  if (H==='wavy'){ ctx.beginPath(); ctx.moveTo(-13.5,-36); ctx.lineTo(13.5,-36); for(let i=0;i<=6;i++) ctx.lineTo(13.5-i*4.5,-11+(i%2)*3); ctx.closePath(); FS(); }
  if (H==='ponytail'){ ctx.beginPath(); ctx.ellipse(-facing*15,-30,5.5,12,-facing*.45+Math.sin(walk)*.15,0,7); FS(); }
  if (H==='pigtails'){ for (const s of [-1,1]){ ctx.beginPath(); ctx.ellipse(s*15,-29,5,10,s*.35,0,7); FS(); } }
  if (H==='braids'){ for (const s of [-1,1]) for (let i=0;i<4;i++){ ctx.beginPath(); ctx.arc(s*11.5,-27+i*5,3.4-i*.3,0,7); FS(); } }
  if (H==='curly'){ for (const [x,y] of [[-13,-27],[13,-27],[-12,-20],[12,-20],[-11,-14],[11,-14]]){ ctx.beginPath(); ctx.arc(x,y,4.8,0,7); FS(); } }
  if (H==='afro'){ ctx.beginPath(); ctx.arc(0,hy-3,18,0,7); FS(); }
  if (H==='hijab'){ rr(ctx,-15.5,-48,31,34,13); FS(); }

  // ---------- legs & shoes ----------
  if (a.outfit==='mermaid'){
    const wv=Math.sin(t*3+walk)*2; const g=ctx.createLinearGradient(-6,-17,6,0); g.addColorStop(0,'#3ccfd8'); g.addColorStop(1,'#7b3fe4'); ctx.fillStyle=g; ctx.strokeStyle='#2a5d8a'; ctx.lineWidth=1.1;
    ctx.beginPath(); ctx.moveTo(-6.5,-17); ctx.lineTo(6.5,-17); ctx.quadraticCurveTo(6,-8,1+wv*.3,-4); ctx.lineTo(-1+wv*.3,-4); ctx.quadraticCurveTo(-6,-8,-6.5,-17); FS();
    ctx.fillStyle='#ff9ad5'; ctx.beginPath(); ctx.moveTo(wv*.3,-5); ctx.quadraticCurveTo(-9+wv,-4,-10+wv,1); ctx.quadraticCurveTo(-3,-1,wv*.3,-3); ctx.quadraticCurveTo(3,-1,10+wv,1); ctx.quadraticCurveTo(9+wv,-4,wv*.3,-5); ctx.fill(); ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,.4)'; ctx.lineWidth=.8; for (let y=-15;y<-6;y+=3){ ctx.beginPath(); ctx.arc(-2,y,2,0,Math.PI); ctx.arc(2,y,2,0,Math.PI); ctx.stroke(); }
  } else {
  const legCol = (a.outfit==='pants'||a.outfit==='overalls') ? a.bottom : a.skin;
  const lf=-3.6+sw*5, rf=3.6-sw*5;
  ctx.strokeStyle=shade(legCol,-60); ctx.lineWidth=5.6;
  ctx.beginPath(); ctx.moveTo(-3.4,-12); ctx.lineTo(lf,-3); ctx.moveTo(3.4,-12); ctx.lineTo(rf,-3); ctx.stroke();
  ctx.strokeStyle=legCol; ctx.lineWidth=4;
  ctx.beginPath(); ctx.moveTo(-3.4,-12); ctx.lineTo(lf,-3); ctx.moveTo(3.4,-12); ctx.lineTo(rf,-3); ctx.stroke();
  const sc=a.shoeColor||'#ffffff';
  for (const fx of [lf,rf]){
    const x=fx+facing*.8;
    if (a.shoes==='boots'){ P(sc); rr(ctx,x-3.2,-8,6.4,7,2); FS(); ctx.beginPath(); ctx.ellipse(x+facing,-1.6,4.2,2.2,0,0,7); FS(); }
    else if (a.shoes==='sandals'){ ctx.fillStyle=a.skin; ctx.beginPath(); ctx.ellipse(x+facing,-1.8,3.8,2,0,0,7); ctx.fill(); P(sc); ctx.fillRect(x-3,-2.6,6,1.4); ctx.fillStyle='#8a5a3a'; ctx.fillRect(x-3.8+facing,-.8,7.6,1.2); }
    else if (a.shoes==='slippers'){ P('#ffffff'); ctx.beginPath(); ctx.ellipse(x+facing,-2.4,4.6,3,0,0,7); FS(); ctx.beginPath(); ctx.ellipse(x+facing*2-1.2,-6,1.1,2.8,-.2,0,7); ctx.ellipse(x+facing*2+1.2,-6,1.1,2.8,.2,0,7); FS(); ctx.fillStyle='#ff8fb0'; ctx.beginPath(); ctx.arc(x+facing*3.5,-2.6,.8,0,7); ctx.fill(); }
    else if (a.shoes==='rainbowshoes'){ ctx.save(); ctx.beginPath(); ctx.ellipse(x+facing,-2.2,4.2,2.5,0,0,7); ctx.clip(); ['#ff4d6d','#ff9f1c','#ffd23f','#5cc96b','#4fa3ff'].forEach((c,i)=>{ ctx.fillStyle=c; ctx.fillRect(x-4+facing,-4.7+i,9,1.1); }); ctx.restore(); ctx.fillStyle='#fff'; ctx.fillRect(x-3.2+facing,-.9,6.4,1.3); }
    else if (a.shoes==='skates'){ P(sc); rr(ctx,x-3.4,-6.5,7,5,2); FS(); ctx.fillStyle='#ccc'; ctx.fillRect(x-3,-1.6,6,1); P('#ff5fa2'); ctx.beginPath(); ctx.arc(x-2.4,.2,1.6,0,7); ctx.arc(x+2.4,.2,1.6,0,7); FS(); }
    else {
      const col = a.shoes==='glitter' ? '#ff8ad8' : sc;
      P(col); ctx.beginPath(); ctx.ellipse(x+facing,-2.2,4.2,2.5,0,0,7); FS();
      ctx.fillStyle = a.shoes==='lightup' ? `hsl(${(t*300)%360},100%,60%)` : '#ffffff';
      ctx.fillRect(x-3.2+facing,-.9,6.4,1.3); ctx.fillStyle='rgba(255,255,255,.55)'; ctx.beginPath(); ctx.ellipse(x+facing*2,-3.4,1.4,.7,0,0,7); ctx.fill();
      if (a.shoes==='glitter'){ star(ctx,x+facing,-2.6,1.6,'#fff7b0'); }
    }
  }

  }
  ctx.translate(0,Math.sin(t*2.4+(a.name||'').length)*.35);
  // ---------- bottoms ----------
  const bc=a.bottom;
  if (a.outfit==='pants' || a.outfit==='overalls'){ P(bc); rr(ctx,-6.5,-17.5,13,7,2.5); FS(); }
  else if (a.outfit==='shorts'){ P(bc); rr(ctx,-6.5,-17.5,13,5.5,2); FS(); }
  else if (a.outfit==='tutu'){ for (let i=0;i<2;i++){ P(i?shade(bc,30):bc); ctx.beginPath(); ctx.moveTo(-6,-17); ctx.lineTo(6,-17); for(let k=0;k<=8;k++) ctx.lineTo(12-k*3,-10.5+i*1.5+(k%2)*2.5); ctx.closePath(); FS(); } }
  else if (a.outfit==='gown'){ const g=ctx.createLinearGradient(0,-17,0,-1); g.addColorStop(0,shade(bc,30)); g.addColorStop(1,bc); ctx.fillStyle=g; ctx.strokeStyle=shade(bc,-70); ctx.lineWidth=1.1; ctx.beginPath(); ctx.moveTo(-6.5,-17); ctx.lineTo(6.5,-17); ctx.quadraticCurveTo(12,-9,15,-1); ctx.quadraticCurveTo(0,1,-15,-1); ctx.quadraticCurveTo(-12,-9,-6.5,-17); FS();
    ctx.strokeStyle=shade(bc,50); ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(-11,-6); ctx.quadraticCurveTo(0,-3,11,-6); ctx.stroke(); for (const [x,y] of [[-6,-9],[5,-11],[9,-4],[-10,-3],[1,-6]]) star(ctx,x,y,1.3,'#fff7c2'); }
  else if (a.outfit==='mermaid'){}
  else if (a.outfit==='dress'){ P(a.shirt); ctx.beginPath(); ctx.moveTo(-6.5,-17); ctx.lineTo(6.5,-17); ctx.quadraticCurveTo(10,-10,12,-5); ctx.lineTo(-12,-5); ctx.quadraticCurveTo(-10,-10,-6.5,-17); FS(); ctx.strokeStyle=shade(a.shirt,40); ctx.lineWidth=1.4; ctx.beginPath(); ctx.moveTo(-11,-7); ctx.lineTo(11,-7); ctx.stroke(); }
  else { P(bc); ctx.beginPath(); ctx.moveTo(-6.5,-17); ctx.lineTo(6.5,-17); ctx.lineTo(11,-9); ctx.quadraticCurveTo(0,-7,-11,-9); ctx.closePath(); FS();
    ctx.strokeStyle=shade(bc,-45); ctx.lineWidth=.8; ctx.beginPath(); for (const px of [-3.5,0,3.5]){ ctx.moveTo(px*.8,-16.5); ctx.lineTo(px*1.5,-8.4); } ctx.stroke(); ctx.strokeStyle='rgba(255,255,255,.35)'; ctx.beginPath(); ctx.moveTo(-9.5,-9.4); ctx.quadraticCurveTo(0,-7.6,9.5,-9.4); ctx.stroke(); }

  // ---------- torso (with pattern) ----------
  const top = a.pattern==='galaxy' ? '#2c1d5e' : a.shirt;
  P(top); rr(ctx,-7.5,-24,15,10.5,4); FS();
  ctx.save(); rr(ctx,-7.5,-24,15,10.5,4); ctx.clip();
  const pt=a.pattern;
  if (pt==='stripes'){ ctx.fillStyle='rgba(255,255,255,.55)'; for (let y=-22;y<-13;y+=3.4) ctx.fillRect(-8,y,16,1.5); }
  if (pt==='dots'){ ctx.fillStyle='rgba(255,255,255,.75)'; for (const [x,y] of [[-4,-21],[2,-21],[-1,-17.5],[5,-17],[-5,-16]]){ ctx.beginPath(); ctx.arc(x,y,1.1,0,7); ctx.fill(); } }
  if (pt==='heart'){ ctx.fillStyle='#ff2e63'; heartPath(ctx,0,-22,5.5); ctx.fill(); }
  if (pt==='star'){ star(ctx,0,-19,4,'#ffd23f'); }
  if (pt==='rainbow'){ ['#ff4d6d','#ff9f1c','#ffd23f','#5cc96b','#4fa3ff','#9b5cff'].forEach((c,i)=>{ ctx.fillStyle=c; ctx.fillRect(-8,-24+i*1.8,16,1.9); }); }
  if (pt==='checks'){ ctx.fillStyle='rgba(255,255,255,.5)'; for (let y=-24;y<-13;y+=3) for (let x=-8;x<8;x+=3) if (((x+y)/3|0)%2===0) ctx.fillRect(x,y,3,3); }
  if (pt==='flowers'){ for (const [x,y] of [[-3.5,-20.5],[3,-17.5]]){ ctx.fillStyle='#fff'; for (let k=0;k<5;k++){ const g=k/5*6.28; ctx.beginPath(); ctx.arc(x+Math.cos(g)*1.4,y+Math.sin(g)*1.4,1.1,0,7); ctx.fill(); } ctx.fillStyle='#ffd23f'; ctx.beginPath(); ctx.arc(x,y,.9,0,7); ctx.fill(); } }
  if (pt==='lightning'){ ctx.fillStyle='#ffd23f'; ctx.beginPath(); ctx.moveTo(1,-23); ctx.lineTo(-3,-18); ctx.lineTo(0,-18); ctx.lineTo(-2,-14); ctx.lineTo(3,-19.5); ctx.lineTo(0,-19.5); ctx.closePath(); ctx.fill(); }
  if (pt==='moon'){ ctx.fillStyle='#fff3a0'; ctx.beginPath(); ctx.arc(-1,-19,3.4,0,7); ctx.fill(); ctx.fillStyle=top; ctx.beginPath(); ctx.arc(.5,-20,3,0,7); ctx.fill(); star(ctx,4,-22,1.3,'#fff'); star(ctx,-5,-16,1,'#fff'); }
  if (pt==='galaxy'){ for (let i=0;i<6;i++){ ctx.fillStyle=i%2?'#ffffff':'#ffd6ff'; ctx.fillRect(-6+((i*37)%12),-23+((i*23)%9),1,1); } ctx.fillStyle='rgba(200,107,255,.45)'; ctx.beginPath(); ctx.ellipse(1,-18,6,2.5,.4,0,7); ctx.fill(); }
  ctx.restore();
  if (!['dress','gown'].includes(a.outfit)){ ctx.fillStyle='rgba(0,0,0,.12)'; ctx.fillRect(-7.5,-15,15,1.5); }
  if (a.hair!=='hijab'){ ctx.fillStyle=shade(top,45); ctx.strokeStyle=shade(top,-60); ctx.lineWidth=.8; } else { ctx.fillStyle='rgba(0,0,0,0)'; ctx.strokeStyle='rgba(0,0,0,0)'; }
  ctx.beginPath(); ctx.moveTo(-4.5,-24); ctx.quadraticCurveTo(-2.5,-20.5,0,-22); ctx.quadraticCurveTo(2.5,-20.5,4.5,-24); ctx.closePath(); ctx.fill(); ctx.stroke();
  if (a.outfit==='overalls'){ P(bc); rr(ctx,-5,-21,10,6,1.5); FS(); ctx.strokeStyle=shade(bc,-40); ctx.lineWidth=1.6; ctx.beginPath(); ctx.moveTo(-4,-21); ctx.lineTo(-5,-24); ctx.moveTo(4,-21); ctx.lineTo(5,-24); ctx.stroke(); ctx.fillStyle='#ffd23f'; ctx.beginPath(); ctx.arc(-3.5,-20,.9,0,7); ctx.arc(3.5,-20,.9,0,7); ctx.fill(); }

  // ---------- arms ----------
  const handY = air ? -31 : -14.5;
  const lh={x:-10.5-sw*3,y:handY}, rhd={x:10.5+sw*3,y:handY};

// Trail particles behind the player (sparkles, hearts, bubbles...).
function makeTrail(type,x,y){
  if (!type||type==='none') return null;
  const base={x:x+(Math.random()-.5)*10,y:y+(Math.random()-.5)*10,vx:(Math.random()-.5)*40,vy:-20-Math.random()*20,life:.8,max:.8,trail:type};
  if (type==='bubbles'){ base.vy=-50; base.r=2+Math.random()*4; }
  if (type==='rainbow'){ base.vx=0; base.vy=0; base.life=base.max=.5; base.hue=(performance.now()/4)%360; }
  if (type==='hearts') base.color=pick(['#ff5fa2','#ff3d6e','#ffb3d9']);
  if (type==='snow'){ base.vy=20+Math.random()*20; base.max=base.life=1.1; }
  if (type==='petals'){ base.vy=10+Math.random()*20; base.rot=Math.random()*6; base.color=pick(['#ffb3d9','#ff8fc7','#ffd6ec']); base.max=base.life=1.1; }
  if (type==='fire'){ base.vy=-60-Math.random()*40; base.color=pick(['#ff5a36','#ff9f1c','#ffd23f']); base.max=base.life=.5; }
  if (type==='sparkle') base.color=pick(['#ff9de2','#ffe066','#9bf6ff','#ffffff']);
  return base;
}
function drawParticle(ctx,p){
  const a=Math.max(0,p.life/(p.max||.7));
  ctx.globalAlpha=a;
  switch(p.trail){
    case 'sparkle': star(ctx,p.x,p.y,4.5*a+1,p.color); break;
    case 'stars': star(ctx,p.x,p.y,6,'#ffcc1a'); break;
    case 'hearts': ctx.fillStyle=p.color; heartPath(ctx,p.x,p.y-4,8); ctx.fill(); break;
    case 'bubbles': ctx.strokeStyle='rgba(120,200,255,.9)'; ctx.lineWidth=1.4; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.stroke(); ctx.fillStyle='rgba(255,255,255,.7)'; ctx.beginPath(); ctx.arc(p.x-p.r*.4,p.y-p.r*.4,p.r*.25,0,7); ctx.fill(); break;
    case 'notes': ctx.fillStyle='#7b3fe4'; ctx.font='bold 14px sans-serif'; ctx.textAlign='center'; ctx.fillText(p.x%2>1?'♪':'♫',p.x,p.y); break;
    case 'snow': { ctx.strokeStyle='#ffffff'; ctx.lineWidth=1.3; for (let k=0;k<3;k++){ const g=k*Math.PI/3; ctx.beginPath(); ctx.moveTo(p.x-Math.cos(g)*4,p.y-Math.sin(g)*4); ctx.lineTo(p.x+Math.cos(g)*4,p.y+Math.sin(g)*4); ctx.stroke(); } ctx.strokeStyle='rgba(120,180,255,.6)'; ctx.lineWidth=.6; ctx.beginPath(); ctx.arc(p.x,p.y,1.5,0,7); ctx.stroke(); break; }
    case 'petals': ctx.save(); ctx.translate(p.x,p.y); ctx.rotate((p.rot||0)+p.life*4); ctx.fillStyle=p.color; ctx.beginPath(); ctx.ellipse(0,0,4,2.2,0,0,7); ctx.fill(); ctx.restore(); break;
    case 'fire': ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,4*a+1,0,7); ctx.fill(); break;
    case 'rainbow': ctx.fillStyle=`hsl(${p.hue},95%,62%)`; ctx.beginPath(); ctx.arc(p.x,p.y,6*a+2,0,7); ctx.fill(); break;
    default: ctx.fillStyle=p.color||'#fff'; ctx.fillRect(p.x-3*a,p.y-3*a,6*a,6*a);
  }
  ctx.globalAlpha=1;
}

/* ---------- blocks (pretty versions, cached as sprites when they don't animate) ---------- */
const ANIMATED_BLOCKS = new Set(['L','C','O','E','D','B','R','G','n','Z','F','K','P','U','X','>','<','w','i','k','f','e','r','g','m']);
const spriteCache = {};
function blockSprite(ch){
  if (spriteCache[ch]) return spriteCache[ch];
  const c=document.createElement('canvas'); c.width=c.height=TILE*3;
  const x=c.getContext('2d'); x.scale(3,3); paintBlock(x,ch,0,0);
  return spriteCache[ch]=c;
}
function drawBlock(ctx,ch,x,y,t=0,size=TILE){
  if (!BLOCKS[ch]) return;
  if (!ANIMATED_BLOCKS.has(ch)){ ctx.drawImage(blockSprite(ch),x,y,size,size); return; }
  ctx.save(); ctx.translate(x,y); ctx.scale(size/TILE,size/TILE); paintBlock(ctx,ch,t,x); ctx.restore();
}
function solidBase(ctx,color,r=5){
  const g=ctx.createLinearGradient(0,0,0,40); g.addColorStop(0,shade(color,28)); g.addColorStop(1,shade(color,-32));
  ctx.fillStyle=g; rr(ctx,0,0,40,40,r); ctx.fill();
}
function bevel(ctx,r=5){

  ctx.fillStyle='rgba(0,0,0,.16)'; rr(ctx,3,35,34,3,1.5); ctx.fill();
  ctx.strokeStyle='rgba(30,10,40,.28)'; ctx.lineWidth=1; rr(ctx,.5,.5,39,39,r); ctx.stroke();
}
function paintBlock(ctx,ch,t,seed){
  const b=BLOCKS[ch];
  switch(ch){
    case '#': {
      const g=ctx.createLinearGradient(0,0,0,40); g.addColorStop(0,'#a8713f'); g.addColorStop(1,'#7a4c26');
      ctx.fillStyle=g; rr(ctx,0,0,40,40,5); ctx.fill();
      ctx.fillStyle='rgba(0,0,0,.15)'; for (const [x,y,r] of [[9,24,2.5],[26,30,2],[31,19,1.6],[16,34,1.5]]){ ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill(); }
      const gg=ctx.createLinearGradient(0,0,0,14); gg.addColorStop(0,'#8ef07e'); gg.addColorStop(1,'#3fae4c');
      ctx.fillStyle=gg; ctx.beginPath(); ctx.moveTo(0,5); ctx.arcTo(0,0,5,0,5); ctx.lineTo(35,0); ctx.arcTo(40,0,40,5,5); ctx.lineTo(40,12);
      for (let i=8;i>=0;i--) ctx.lineTo(i*5,12+(i%2?4:0)); ctx.closePath(); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.35)'; ctx.fillRect(4,2,32,2.5);

      ctx.strokeStyle='rgba(255,255,255,.5)'; ctx.lineWidth=1.5; ctx.beginPath(); for (let x=0;x<=40;x+=4) ctx.lineTo(x,8+Math.sin(t*3+(seed+x)*.15)*2); ctx.stroke();
      ctx.fillStyle='rgba(255,255,255,.45)'; const by=36-((t*20+seed)%30); ctx.beginPath(); ctx.arc((seed*.7)%30+5,by,2,0,7); ctx.fill(); break; }
    case 'r': { const g=ctx.createLinearGradient(0,0,40,40); g.addColorStop(0,'#e9d6ff'); g.addColorStop(.5,'#b58cff'); g.addColorStop(1,'#6a3fd1'); ctx.fillStyle=g; rr(ctx,0,0,40,40,5); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.35)'; ctx.beginPath(); ctx.moveTo(4,4); ctx.lineTo(20,4); ctx.lineTo(4,20); ctx.fill(); ctx.strokeStyle='rgba(255,255,255,.4)'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(0,40); ctx.lineTo(20,20); ctx.lineTo(40,30); ctx.moveTo(20,20); ctx.lineTo(28,0); ctx.stroke();
      if (Math.sin(t*3+seed*.3)>.6) star(ctx,30,10,4,'#ffffff'); bevel(ctx); break; }
    case 'g': { const g=ctx.createLinearGradient(0,0,0,40); g.addColorStop(0,'#fff09a'); g.addColorStop(.5,'#ffc93c'); g.addColorStop(1,'#d18a00'); ctx.fillStyle=g; rr(ctx,0,0,40,40,5); ctx.fill();
      const sh=((t*40+seed)%120)-40; ctx.save(); rr(ctx,0,0,40,40,5); ctx.clip(); ctx.fillStyle='rgba(255,255,255,.55)'; ctx.beginPath(); ctx.moveTo(sh,0); ctx.lineTo(sh+10,0); ctx.lineTo(sh-10,40); ctx.lineTo(sh-20,40); ctx.fill(); ctx.restore();
      ctx.strokeStyle='#b07300'; ctx.lineWidth=1; rr(ctx,5,5,30,30,3); ctx.stroke(); bevel(ctx); break; }
    case 'Z': { ctx.save(); ctx.translate(20,20); const g=ctx.createRadialGradient(0,0,2,0,0,17); g.addColorStop(0,'#ffffff'); g.addColorStop(.35,'#b58cff'); g.addColorStop(1,'#3a1a8a'); ctx.fillStyle=g; ctx.beginPath(); ctx.ellipse(0,0,13,18,0,0,7); ctx.fill();
      ctx.rotate(t*3); ctx.strokeStyle='rgba(255,255,255,.75)'; ctx.lineWidth=1.6; for (let i=0;i<3;i++){ ctx.rotate(2.09); ctx.beginPath(); ctx.arc(0,0,4+i*3.5,0,2.2); ctx.stroke(); } ctx.restore();
      ctx.strokeStyle='#ff6fe8'; ctx.lineWidth=2; ctx.beginPath(); ctx.ellipse(20,20,13,18,0,0,7); ctx.stroke(); break; }
  }
}

/* ---------- sky backgrounds for each level theme ---------- */
const THEMES = {
  day:    { sky:['#5fbaff','#d9f2ff'], sun:'#fff6b0', far:'#9cc3e6', mid:'#86d18a', near:'#5fb865' },
  sunset: { sky:['#ff8e8e','#ffd8a1'], sun:'#fff0c0', far:'#c98bb9', mid:'#e8907a', near:'#b9655f' },
  snow:   { sky:['#8fcfff','#f2faff'], sun:'#ffffff', far:'#c5d8ee', mid:'#e8f2fd', near:'#cfe3f6', snow:true },
  candy:  { sky:['#ffa6e0','#fff1fb'], sun:'#fff3b0', far:'#ffc8ee', mid:'#ff9fd6', near:'#ff7cc6' },
  lava:   { sky:['#ff7f50','#ffd0a0'], sun:'#ffe08a', far:'#a35454', mid:'#b8604a', near:'#7f3a36' },
  night:  { sky:['#140f3a','#4a2c7a'], moon:true, far:'#2b2264', mid:'#36297a', near:'#211c55' },
};
function drawSky(ctx,W,H,camX,t,themeName){
  const th=THEMES[themeName]||THEMES.day;
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,th.sky[0]); g.addColorStop(1,th.sky[1]); ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  if (th.moon){
    for (let i=0;i<60;i++){ const x=((i*137)%W), y=(i*71)%(H*.6); ctx.globalAlpha=.4+.6*Math.abs(Math.sin(t*1.5+i)); ctx.fillStyle='#fff'; ctx.fillRect(x,y,i%5?1.5:2.5,i%5?1.5:2.5); }
    ctx.globalAlpha=1; const mg=ctx.createRadialGradient(800,90,10,800,90,80); mg.addColorStop(0,'rgba(255,250,220,.6)'); mg.addColorStop(1,'rgba(255,250,220,0)'); ctx.fillStyle=mg; ctx.fillRect(700,0,200,200);
    ctx.fillStyle='#fff8dc'; ctx.beginPath(); ctx.arc(800,90,30,0,7); ctx.fill(); ctx.fillStyle=th.sky[0]; ctx.beginPath(); ctx.arc(814,82,26,0,7); ctx.fill();
  } else {
    const sg=ctx.createRadialGradient(800,90,10,800,90,110); sg.addColorStop(0,'rgba(255,255,220,.85)'); sg.addColorStop(1,'rgba(255,255,220,0)'); ctx.fillStyle=sg; ctx.fillRect(680,0,240,220);
    ctx.fillStyle=th.sun; ctx.beginPath(); ctx.arc(800,90,34,0,7); ctx.fill();
  }
  // sun rays
  if (!th.moon){ ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.translate(800,90); ctx.rotate(t*.04);
    for (let i=0;i<12;i++){ ctx.rotate(Math.PI/6); const g=ctx.createLinearGradient(0,0,0,-420); g.addColorStop(0,'rgba(255,250,210,.09)'); g.addColorStop(1,'rgba(255,250,210,0)'); ctx.fillStyle=g; ctx.beginPath(); ctx.moveTo(-6,0); ctx.lineTo(-40,-420); ctx.lineTo(40,-420); ctx.lineTo(6,0); ctx.fill(); }
    ctx.restore(); }
  // clouds
  if (!th.moon) for (let i=0;i<7;i++){
    const cx=((i*290-camX*.12+t*8)%(W+340)+W+340)%(W+340)-170, cy=40+(i%3)*42;
    ctx.fillStyle='rgba(255,255,255,.55)'; ctx.beginPath(); ctx.ellipse(cx+28,cy+14,46,10,0,0,7); ctx.fill();
    const cg=ctx.createLinearGradient(0,cy-34,0,cy+22); cg.addColorStop(0,'#ffffff'); cg.addColorStop(.6,'rgba(255,255,255,.95)'); cg.addColorStop(1,'rgba(205,220,245,.95)'); ctx.fillStyle=cg;
    ctx.beginPath(); ctx.arc(cx,cy,18,0,7); ctx.arc(cx+24,cy-10,24,0,7); ctx.arc(cx+52,cy,17,0,7); ctx.arc(cx+28,cy+4,18,0,7); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.8)'; ctx.beginPath(); ctx.arc(cx+18,cy-18,9,0,7); ctx.fill();
  }
  if (!th.moon){ ctx.strokeStyle='rgba(60,50,90,.55)'; ctx.lineWidth=1.6; for (let i=0;i<4;i++){ const bx=((i*330+t*(30+i*6)-camX*.2)%(W+200)+W+200)%(W+200)-100, by=70+i*28+Math.sin(t+i)*8, fl=Math.sin(t*8+i)*4; ctx.beginPath(); ctx.moveTo(bx-7,by-fl); ctx.quadraticCurveTo(bx-3,by-3,bx,by); ctx.quadraticCurveTo(bx+3,by-3,bx+7,by-fl); ctx.stroke(); } }
  else { for (let i=0;i<12;i++){ const fx=((i*157+Math.sin(t*.5+i)*40-camX*.3)%W+W)%W, fy=200+((i*61)%160)+Math.sin(t*1.3+i)*14; ctx.fillStyle=`rgba(255,240,140,${.35+.35*Math.sin(t*3+i)})`; ctx.beginPath(); ctx.arc(fx,fy,2.2,0,7); ctx.fill(); } }
  const layer=(par,base,amp,col,f1,f2,snow)=>{
    ctx.fillStyle=col; ctx.beginPath(); ctx.moveTo(0,H);
    const off=camX*par;
    for (let x=0;x<=W+20;x+=16){ const wx=x+off; ctx.lineTo(x,H-base-amp*(Math.sin(wx*f1)*.6+Math.sin(wx*f2+1.7)*.4)); }
    ctx.lineTo(W,H); ctx.closePath(); ctx.fill();
    if (snow){ ctx.strokeStyle='rgba(255,255,255,.85)'; ctx.lineWidth=6; ctx.beginPath(); let on=false; for (let x=0;x<=W+20;x+=8){ const wx=x+off; const y=H-base-amp*(Math.sin(wx*f1)*.6+Math.sin(wx*f2+1.7)*.4); if (y<H-base-amp*.4){ on?ctx.lineTo(x,y+2):ctx.moveTo(x,y+2); on=true; } else on=false; } ctx.stroke(); }
  };
  layer(.12,200,70,th.far,.006,.013,!!th.snow);
  layer(.3,120,40,th.mid,.01,.023);
  // tree silhouettes on the mid layer
  ctx.fillStyle=shade(th.near.length===7?th.near:'#5fb865',-15);
  const tcol=shade(th.near.length===7?th.near:'#5fb865',-15), thi=shade(th.near.length===7?th.near:'#5fb865',8);
  for (let i=0;i<16;i++){ const x=((i*97-camX*.45)%(W+100)+W+100)%(W+100)-50, h=34+(i*13)%22, by=H-66;
    if (i%3===0){ ctx.fillStyle=tcol; ctx.fillRect(x+10,by-h*.4,4,h*.4); ctx.beginPath(); ctx.arc(x+12,by-h*.55,h*.38,0,7); ctx.arc(x+4,by-h*.4,h*.26,0,7); ctx.arc(x+20,by-h*.4,h*.26,0,7); ctx.fill(); ctx.fillStyle=thi; ctx.beginPath(); ctx.arc(x+8,by-h*.66,h*.15,0,7); ctx.fill(); }
    else { ctx.fillStyle=tcol; for (let k=0;k<3;k++){ ctx.beginPath(); ctx.moveTo(x+12,by-h+k*h*.22); ctx.lineTo(x-1+k*-1,by-h*.35+k*h*.18); ctx.lineTo(x+25+k,by-h*.35+k*h*.18); ctx.fill(); } ctx.fillStyle=thi; ctx.beginPath(); ctx.moveTo(x+12,by-h); ctx.lineTo(x+6,by-h*.62); ctx.lineTo(x+11,by-h*.62); ctx.fill(); } }
  layer(.55,60,22,th.near,.017,.04);
  ctx.save(); ctx.globalCompositeOperation='lighter'; for (let i=0;i<18;i++){ const mx=((i*173+t*(8+i%5*3)-camX*.6)%(W+40)+W+40)%(W+40)-20, my=(i*89+Math.sin(t*.8+i)*30)%(H-40)+20, a=.25+.25*Math.sin(t*2+i*1.7); ctx.fillStyle=th.moon?`rgba(255,240,150,${a})`:`rgba(255,255,230,${a*.8})`; ctx.beginPath(); ctx.arc(mx,my,1.6+(i%3)*.6,0,7); ctx.fill(); } ctx.restore();
  { const fg=ctx.createLinearGradient(0,0,0,H); fg.addColorStop(0,'rgba(255,245,220,.10)'); fg.addColorStop(.5,'rgba(255,255,255,0)'); fg.addColorStop(1,'rgba(255,255,255,.12)'); ctx.fillStyle=fg; ctx.fillRect(0,0,W,H); }
  if (th.snow){ ctx.fillStyle='rgba(255,255,255,.85)'; for (let i=0;i<40;i++){ const x=((i*53+t*20*(1+i%3))%W), y=((i*97+t*40*(1+i%2))%H); ctx.beginPath(); ctx.arc(x,y,1.5+(i%3)*.6,0,7); ctx.fill(); } }
}

// Grass ground tile with little tufts and flowers (for City + Forest).
function drawGrass(ctx,x,y,s,gx,gy,c1,c2){
  const h=(gx*928371+gy*12347)%97;
  ctx.fillStyle=(gx+gy)%2?c1:c2; ctx.fillRect(x,y,s,s);
  ctx.fillStyle='rgba(255,255,255,.07)'; ctx.fillRect(x,y,s,2);
  ctx.strokeStyle='rgba(30,90,40,.35)'; ctx.lineWidth=1.2;
  for (let i=0;i<3;i++){ const tx=x+((h*(i+3))%40)+4, ty=y+((h*(i+7))%40)+5; ctx.beginPath(); ctx.moveTo(tx,ty); ctx.lineTo(tx-1.5,ty-4); ctx.moveTo(tx+2,ty); ctx.lineTo(tx+3,ty-4); ctx.stroke(); }
  if (h%5===0){ const fx=x+(h%36)+6, fy=y+((h*3)%34)+8; ctx.fillStyle=['#fff','#ffe066','#ff9ad5'][h%3]; for(let k=0;k<5;k++){ const g=k/5*6.28; ctx.beginPath(); ctx.arc(fx+Math.cos(g)*2,fy+Math.sin(g)*2,1.4,0,7); ctx.fill(); } ctx.fillStyle='#ffc93c'; ctx.beginPath(); ctx.arc(fx,fy,1,0,7); ctx.fill(); }
}
function smoke(ctx,x,y,t,seed){
  for (let i=0;i<3;i++){ const p=((t*.6+i/3+seed*.13)%1); ctx.fillStyle=`rgba(240,240,250,${.55*(1-p)})`; ctx.beginPath(); ctx.arc(x+Math.sin(p*6+seed)*3,y-p*22,2.5+p*5,0,7); ctx.fill(); }
}
function groundShadow(ctx,cx,cy,w){ ctx.fillStyle='rgba(20,30,20,.22)'; ctx.beginPath(); ctx.ellipse(cx,cy,w,w*.28,0,0,7); ctx.fill(); }
function litWindow(ctx,x,y,w,h,t,seed){
  const on=Math.sin(t*.4+seed*1.7)>-.3;
  const g=ctx.createLinearGradient(x,y,x,y+h); g.addColorStop(0,on?'#fff7c2':'#cdeeff'); g.addColorStop(1,on?'#ffd36b':'#8fc8ee');
  ctx.fillStyle=g; rr(ctx,x,y,w,h,1.2); ctx.fill(); ctx.fillStyle='rgba(255,255,255,.6)'; ctx.fillRect(x+1,y+1,w*.35,h*.4);
}

// City tile art. (x,y) top-left, size s. cell = {t, c}
function drawCity(ctx,cell,x,y,s,t,nb){
  const k=cell.t, c=cell.c||'#ff7eb3', u=s/48, seed=x*.13+y*.07;
  ctx.save(); ctx.translate(x,y); ctx.scale(u,u); ctx.lineJoin='round';
  const wall=(px,py,w,h,col)=>{ const g=ctx.createLinearGradient(px,0,px+w,0); g.addColorStop(0,shade(col,18)); g.addColorStop(1,shade(col,-22)); ctx.fillStyle=g; ctx.fillRect(px,py,w,h); ctx.strokeStyle=shade(col,-60); ctx.lineWidth=1; ctx.strokeRect(px+.5,py+.5,w-1,h-1); };
  if (k==='road'){
    const n=nb||{};
    ctx.fillStyle='#c9ccd6'; ctx.fillRect(0,0,48,48);
    ctx.fillStyle='#4f5463'; ctx.fillRect(n.l?0:5,n.u?0:5,48-(n.l?0:5)-(n.r?0:5),48-(n.u?0:5)-(n.d?0:5));
    ctx.fillStyle='rgba(255,255,255,.05)'; for (let i=0;i<6;i++) ctx.fillRect((i*17+seed*40)%44,(i*29)%44,2,2);
    ctx.fillStyle='#ffe066';
    if (n.l||n.r) for(let i=2;i<48;i+=12) ctx.fillRect(i,23,6,2);
    if (n.u||n.d) for(let i=2;i<48;i+=12) ctx.fillRect(23,i,2,6);
  } else if (k==='house'){
    groundShadow(ctx,24,44,20); wall(9,22,30,22,c);
    const rg=ctx.createLinearGradient(0,6,0,24); rg.addColorStop(0,'#e5533f'); rg.addColorStop(1,'#a8321f'); ctx.fillStyle=rg; ctx.beginPath(); ctx.moveTo(4,25); ctx.lineTo(24,6); ctx.lineTo(44,25); ctx.closePath(); ctx.fill(); ctx.strokeStyle='#7a2010'; ctx.stroke();
    ctx.fillStyle='#8a5a3a'; ctx.fillRect(32,9,6,10); smoke(ctx,35,8,t,seed);
    ctx.fillStyle='#7a4b2a'; rr(ctx,20,31,8,13,3); ctx.fill(); ctx.fillStyle='#ffd23f'; ctx.beginPath(); ctx.arc(26,38,1,0,7); ctx.fill();
    litWindow(ctx,12,28,6,6,t,seed); litWindow(ctx,30,28,6,6,t,seed+1);
    ctx.fillStyle='#5cc96b'; ctx.fillRect(10,42,8,2); ctx.fillStyle='#ff5fa2'; ctx.beginPath(); ctx.arc(12,41,1.4,0,7); ctx.arc(16,41,1.4,0,7); ctx.fill();
  } else if (k==='apartment'){
    groundShadow(ctx,24,46,22); wall(6,2,36,44,c); ctx.fillStyle=shade(c,-40); ctx.fillRect(5,1,38,4);
    for(let r=0;r<4;r++) for(let q=0;q<3;q++) litWindow(ctx,10+q*11,9+r*8,6,5,t,seed+r*3+q);
    ctx.fillStyle='#5b3a28'; rr(ctx,19,39,10,7,2); ctx.fill(); ctx.fillStyle='#ff7eb3'; ctx.fillRect(17,37,14,2);
  } else if (k==='tower'){
    groundShadow(ctx,24,46,18);
    const g=ctx.createLinearGradient(10,0,38,0); g.addColorStop(0,shade(c,30)); g.addColorStop(.5,c); g.addColorStop(1,shade(c,-35)); ctx.fillStyle=g; ctx.fillRect(10,-30,28,76);
    ctx.fillStyle='rgba(20,40,90,.45)'; for(let r=0;r<9;r++) for(let q=0;q<3;q++){ ctx.fillStyle=Math.sin(t*.5+r*1.3+q+seed)>.4?'rgba(255,240,170,.9)':'rgba(30,60,120,.5)'; ctx.fillRect(14+q*8,-25+r*8,5,5); }
    const sh=((t*20+seed*50)%120)-30; ctx.save(); ctx.beginPath(); ctx.rect(10,-30,28,76); ctx.clip(); ctx.fillStyle='rgba(255,255,255,.25)'; ctx.beginPath(); ctx.moveTo(10,sh); ctx.lineTo(38,sh-20); ctx.lineTo(38,sh-12); ctx.lineTo(10,sh+8); ctx.fill(); ctx.restore();
    ctx.fillStyle='#8a90a0'; ctx.fillRect(12,-34,24,4); ctx.fillRect(23,-44,2,10); ctx.fillStyle=Math.sin(t*4)>0?'#ff4d4d':'#7a1b1b'; ctx.beginPath(); ctx.arc(24,-45,2.5,0,7); ctx.fill();
  } else if (k==='shop'){
    groundShadow(ctx,24,46,21); wall(6,16,36,30,'#f4f1ea');
    for(let i=0;i<6;i++){ ctx.fillStyle=i%2?'#fff':c; ctx.beginPath(); ctx.moveTo(4+i*6.7,12); ctx.lineTo(10.7+i*6.7,12); ctx.lineTo(10.7+i*6.7,20); ctx.arc(7.35+i*6.7,20,3.35,0,Math.PI); ctx.closePath(); ctx.fill(); }
    litWindow(ctx,9,27,15,12,t,seed); ctx.fillStyle='#ff7eb3'; ctx.beginPath(); ctx.arc(14,35,2,0,7); ctx.fill(); ctx.fillStyle='#ffd23f'; ctx.beginPath(); ctx.arc(19,35,2,0,7); ctx.fill();
    ctx.fillStyle='#7a4b2a'; rr(ctx,28,28,10,18,2); ctx.fill(); ctx.fillStyle='#fff'; rr(ctx,14,4,20,7,2); ctx.fill(); ctx.fillStyle=c; ctx.font='bold 6px sans-serif'; ctx.textAlign='center'; ctx.fillText('SHOP',24,9.5);
  } else if (k==='park'){
    ctx.fillStyle='#59c26a'; rr(ctx,2,2,44,44,8); ctx.fill(); ctx.fillStyle='#e9d8a6'; rr(ctx,2,20,44,8,4); ctx.fill();
    for (const [tx,ty] of [[12,11],[37,37]]){ groundShadow(ctx,tx,ty+7,8); ctx.fillStyle='#2f8f45'; ctx.beginPath(); ctx.arc(tx+Math.sin(t*1.5+tx)*.8,ty,8,0,7); ctx.fill(); ctx.fillStyle='#4cc062'; ctx.beginPath(); ctx.arc(tx-2,ty-2,4,0,7); ctx.fill(); }
    ctx.fillStyle='#a0612f'; ctx.fillRect(28,8,12,3); ctx.fillRect(29,11,1.5,3); ctx.fillRect(37.5,11,1.5,3);
    ctx.fillStyle='#ff7eb3'; for (const [fx,fy] of [[8,36],[14,40],[34,13]]){ ctx.beginPath(); ctx.arc(fx,fy,2,0,7); ctx.fill(); }
  } else if (k==='tree'){
    groundShadow(ctx,24,42,12); const sw=Math.sin(t*1.6+seed*5)*1.5;
    ctx.fillStyle='#7a4b2a'; ctx.fillRect(21,26,6,16);
    for (const [cx,cy,r,col] of [[24,20,15,'#2a8f40'],[18,22,9,'#2f9e48'],[30,22,9,'#2f9e48'],[24,15,10,'#46c25e']]){ ctx.fillStyle=col; ctx.beginPath(); ctx.arc(cx+sw,cy,r,0,7); ctx.fill(); }
    ctx.fillStyle='rgba(255,255,255,.2)'; ctx.beginPath(); ctx.arc(19+sw,12,4,0,7); ctx.fill();
  } else if (k==='school'){
    groundShadow(ctx,24,46,22); wall(4,18,40,28,'#d9573b');
    ctx.fillStyle='#b5442c'; ctx.beginPath(); ctx.moveTo(2,20); ctx.lineTo(24,8); ctx.lineTo(46,20); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(24,16,3.5,0,7); ctx.fill(); ctx.strokeStyle='#333'; ctx.lineWidth=.8; ctx.beginPath(); ctx.moveTo(24,16); ctx.lineTo(24,14); ctx.moveTo(24,16); ctx.lineTo(25.5,16.5); ctx.stroke();
    ctx.fillStyle='#fff'; rr(ctx,19,32,10,14,2); ctx.fill(); litWindow(ctx,8,24,8,7,t,seed); litWindow(ctx,32,24,8,7,t,seed+2);
    ctx.fillStyle='#555'; ctx.fillRect(41,-6,1.5,24); const wv=Math.sin(t*4)*1.5; ctx.fillStyle='#4fa3ff'; ctx.beginPath(); ctx.moveTo(42.5,-6); ctx.lineTo(52,-4+wv); ctx.lineTo(42.5,0); ctx.fill();
  } else if (k==='hospital'){
    groundShadow(ctx,24,46,22); wall(4,8,40,38,'#fafafa');
    ctx.fillStyle='#ef3b4a'; rr(ctx,20,13,8,20,1.5); ctx.fill(); rr(ctx,14,19,20,8,1.5); ctx.fill();
    litWindow(ctx,7,36,7,6,t,seed); litWindow(ctx,34,36,7,6,t,seed+1); ctx.fillStyle='#bfe9ff'; rr(ctx,18,37,12,9,2); ctx.fill();
  } else if (k==='fountain'){
    ctx.fillStyle='#59c26a'; rr(ctx,2,2,44,44,8); ctx.fill(); groundShadow(ctx,24,30,20);
    ctx.fillStyle='#c9ced9'; ctx.beginPath(); ctx.arc(24,26,18,0,7); ctx.fill(); ctx.fillStyle='#e6e9f2'; ctx.beginPath(); ctx.arc(24,25,16,0,7); ctx.fill();
    const g=ctx.createRadialGradient(24,26,2,24,26,14); g.addColorStop(0,'#bdeeff'); g.addColorStop(1,'#3fa6e8'); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(24,26,13.5,0,7); ctx.fill();
    ctx.fillStyle='#c9ced9'; ctx.fillRect(22,14,4,12);
    ctx.strokeStyle='rgba(255,255,255,.8)'; ctx.lineWidth=1.5; for (const s of [-1,1]){ ctx.beginPath(); ctx.moveTo(24,13); ctx.quadraticCurveTo(24+s*8,4+Math.sin(t*6)*1.5,24+s*11,22); ctx.stroke(); }

    else { ctx.fillStyle='#7a4b2a'; ctx.fillRect(21,26,6,17);

    ctx.fillStyle='#8a7a5a'; ctx.beginPath(); ctx.ellipse(24,26,23,18,0,0,7); ctx.fill();

function setupCanvas(canvas,w,h){
  const dpr=Math.min(2,window.devicePixelRatio||1);
  canvas.width=w*dpr; canvas.height=h*dpr;
  const ctx=canvas.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); return ctx;
}
function canvasPos(e,canvas,w,h){
  const r=canvas.getBoundingClientRect();
  return { x:(e.clientX-r.left)*w/r.width, y:(e.clientY-r.top)*h/r.height };
}
function miniCanvas(size,draw){
  const c=document.createElement('canvas'); c.style.width=size+'px'; c.style.height=size+'px';
  const ctx=setupCanvas(c,size,size); draw(ctx); return c;
}
function avatarCanvas(a,size,opts={}){
  return miniCanvas(size,ctx=>drawAvatar(ctx,size/2,size*.95,a,{scale:size/58,...opts}));
}

const app=document.getElementById('app');

function go(name,...args){
  if (cleanup){ cleanup(); cleanup=null; }
  app.innerHTML='';
  window.scrollTo(0,0);
  currentScreen=name;

}
const $=(sel,root=app)=>root.querySelector(sel);
const $$=(sel,root=app)=>[...root.querySelectorAll(sel)];
function loop(fn){
  let run=true, last=performance.now();
  const step=now=>{ if(!run) return; const dt=Math.min(1/30,(now-last)/1000); last=now; fn(dt,now/1000); requestAnimationFrame(step); };
  requestAnimationFrame(step);
  return ()=>{ run=false; };
}
const isTouch=()=>window.matchMedia('(pointer: coarse)').matches;
function holdButtons(keys){
  $$('[data-hold]').forEach(b=>{
    const k=b.dataset.hold;
    b.addEventListener('pointerdown',e=>{ e.preventDefault(); keys[k]=true; });
    for (const ev of ['pointerup','pointerleave','pointercancel']) b.addEventListener(ev,()=>{ keys[k]=false; });
  });
}
function keyboard(keys,extra){
  const map={ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right',ArrowUp:'jump',w:'jump',W:'jump',' ':'jump'};
  const dn=e=>{ if(e.target.tagName==='INPUT') return; if(map[e.key]){ keys[map[e.key]]=true; e.preventDefault(); } extra&&extra(e); };
  const up=e=>{ if(map[e.key]) keys[map[e.key]]=false; };
  addEventListener('keydown',dn); addEventListener('keyup',up);
  return ()=>{ removeEventListener('keydown',dn); removeEventListener('keyup',up); };
}

    if (slot==='trail'){
      if (id==='none'){ ctx.font=`${size*.45}px sans-serif`; ctx.textAlign='center'; ctx.fillText('🚫',size/2,size*.65); return; }
      for (let i=0;i<8;i++){ const p=makeTrail(id,size*.15+i*size*.1,size*.5+Math.sin(i*1.3)*size*.15); p.x=size*.15+i*size*.1; p.y=size*.5+Math.sin(i*1.3)*size*.15; p.life=p.max*(.35+i*.08); if(id==='rainbow') p.hue=i*45; drawParticle(ctx,p); }

    const ph=(t*.55)%1, ax=10+ph*125, ay=gy-30-Math.sin(ph*Math.PI)*58; drawAvatar(ctx,ax,ay,S.avatar,{scale:.95,facing:1,arms:ph>.06&&ph<.94,t,walk:t*12,shadow:false}); }

    drawCity(ctx,{t:'house',c:'#ffb84f'},0,gy-58,46,t); drawCity(ctx,{t:'tower',c:'#7aa8ff'},50,gy-60,48,t); drawCity(ctx,{t:'shop',c:'#ff5fa2'},104,gy-58,46,t);
    for(let i=0;i<2;i++){ const cx=((t*50+i*90)%(W+40))-20; ctx.fillStyle=i?'#ffd23f':'#ef3b4a'; rr(ctx,cx,gy-11,18,9,3); ctx.fill(); ctx.fillStyle='#bfe9ff'; ctx.fillRect(cx+5,gy-10,7,4); } }
  else if(k==='forest'){ drawForest(ctx,{t:'tree'},-6,gy-50,48,t,0,1); drawForest(ctx,{t:'cottage',c:'#ff9ad5'},34,gy-50,48,t,2,2); drawForest(ctx,{t:'mushroom'},78,gy-48,46,t,3,3); drawForest(ctx,{t:'tree'},116,gy-52,48,t,1,1);
    for(let i=0;i<6;i++){ ctx.fillStyle=`rgba(255,240,140,${.5+.4*Math.sin(t*3+i)})`; ctx.beginPath(); ctx.arc((i*31+Math.sin(t+i)*10)%W,20+(i*17)%40,2,0,7); ctx.fill(); } }

    star(ctx,ox+3*cs+14,oy+cs+14,11+Math.sin(t*4),'#ffd23f');

    ['➡️','➡️','⬇️','➡️'].forEach((e,j)=>{ ctx.globalAlpha=j<=i?1:.35; ctx.font='14px sans-serif'; ctx.fillText(e,ox+j*22,oy-6); }); ctx.globalAlpha=1; }
  else if(k==='art'){ ctx.fillStyle='rgba(255,253,246,.95)'; rr(ctx,20,6,120,H-12,12); ctx.fill(); ctx.fillStyle='#e4dccb'; for(let x=32;x<140;x+=14) for(let y=18;y<H-8;y+=14){ ctx.beginPath(); ctx.arc(x,y,1.2,0,7); ctx.fill(); }

    const bx=81+Math.sin(t*2)*30, by=gy-20-Math.abs(Math.cos(t*2))*50; ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(bx,by,8,0,7); ctx.fill(); ctx.fillStyle='#ff5fa2'; ctx.beginPath(); ctx.arc(bx,by,8,t*3,t*3+1.6); ctx.lineTo(bx,by); ctx.fill(); }
}

function obbyBonus(tiles){ let b=0; for(const r of tiles) for(const ch of r) b+=BLOCKS[ch]?.bonus||0; return Math.min(60,b); }
function findChar(tiles,ch){ for(let y=0;y<tiles.length;y++){ const x=tiles[y].indexOf(ch); if(x>=0) return {x,y}; } return null; }

let audioCtx=null;
function playNote(i){
  try {
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const notes=[523.25,587.33,659.25,698.46,783.99,880,987.77,1046.5];
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type='triangle'; o.frequency.value=notes[((i%8)+8)%8];
    g.gain.setValueAtTime(.18,audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.5);
    o.connect(g).connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+.5);
  } catch {}
}

SCREENS.play=(level)=>{
  const VW=960, VH=ROWS*TILE, PW=22, PH=38, GRAV=2000, JUMP=720;
  app.innerHTML=`<div class="row" style="margin-bottom:10px"><button class="btn ghost small" id="exit">← Exit</button>
    <span class="muted hide-sm">Move: ← → or A D · Jump: Space / ↑ / W</span></div>
    <div class="canvas-wrap"><canvas class="game" id="cv"></canvas><div id="ov"></div></div>
    <div class="touch ${isTouch()?'on':''}"><div class="row"><button class="tbtn" data-hold="left">◀</button><button class="tbtn" data-hold="right">▶</button></div><button class="tbtn jump" data-hold="jump">⤒</button></div>`;
  const back=()=>go(level.back||'obby');
  $('#exit').onclick=back;
  const canvas=$('#cv'), ctx=setupCanvas(canvas,VW,VH);
  const keys={left:false,right:false,jump:false};
  holdButtons(keys);
  const grid=level.tiles.map(r=>r.split('')), W=grid[0].length;
  const custom=level.kind!=='builtin';
  const sp=findChar(level.tiles,'P')||{x:1,y:9}, gl=findChar(level.tiles,'G');
  const portals=[]; grid.forEach((r,y)=>r.forEach((c,x)=>{ if(c==='Z') portals.push({x,y}); })); portals.sort((p,q)=>p.x-q.x||p.y-q.y);
  let spawn={x:sp.x*TILE+(TILE-PW)/2,y:(sp.y+1)*TILE-PH};
  const pl={x:spawn.x,y:spawn.y,vx:0,vy:0,ground:false,facing:1,coyote:0,buffer:0,boost:0,ice:false,honey:false,walk:0,squash:0};
  const pet={x:pl.x-30,y:pl.y+PH};
  let collected=0,deaths=0,time=0,finished=false,flash=0,shake=0,cpKey=null,lastJump=false,lastPortal=null,camX=0,hasKey=false;
  const parts=[], pops=[], vanishQ=[];
  const tileAt=(x,y)=>(y<0||y>=ROWS||x<0||x>=W)?'.':grid[y][x];
  const solid=(x,y)=>{ if(x<0||x>=W) return true; const ch=tileAt(x,y); return ch==='d'&&hasKey?false:!!BLOCKS[ch]?.solid; };
  const burst=(x,y,color,n=10,sp=300)=>{ for(let i=0;i<n;i++) parts.push({x,y,vx:(Math.random()-.5)*sp,vy:-Math.random()*sp,life:.7,max:.7,color,g:1}); };
  const dust=(x,y)=>{ for(let i=0;i<6;i++) parts.push({x:x+(Math.random()-.5)*16,y,vx:(Math.random()-.5)*120,vy:-Math.random()*60,life:.4,max:.4,color:'rgba(255,255,255,.8)',g:.2,dust:true}); };
  const pop=(x,y,text,color='#ffd23f')=>pops.push({x,y,text,color,life:1});
  const die=()=>{ deaths++; flash=.35; shake=.35; burst(pl.x+PW/2,pl.y+PH/2,'#ff5a36',18); Object.assign(pl,{x:spawn.x,y:spawn.y,vx:0,vy:0,boost:0}); };
  const moveX=dx=>{ pl.x+=dx; const t0=Math.floor(pl.y/TILE), t1=Math.floor((pl.y+PH-1)/TILE);
    if(dx>0){ const tx=Math.floor((pl.x+PW)/TILE); for(let ty=t0;ty<=t1;ty++) if(solid(tx,ty)){ pl.x=tx*TILE-PW; pl.vx=0; break; } }
    else if(dx<0){ const tx=Math.floor(pl.x/TILE); for(let ty=t0;ty<=t1;ty++) if(solid(tx,ty)){ pl.x=(tx+1)*TILE; pl.vx=0; break; } } };
  const landed=(ty,fresh,impact)=>{
    const l=Math.floor(pl.x/TILE), r=Math.floor((pl.x+PW-1)/TILE); pl.ice=false; pl.honey=false; pl.conv=0;
    if (fresh && impact>420){ pl.squash=Math.min(1,impact/1100); dust(pl.x+PW/2,pl.y+PH); }
    for(let x=l;x<=r;x++){ const ch=tileAt(x,ty), b=BLOCKS[ch]; if(!b) continue;
      if(b.bounce){ pl.vy=-b.bounce; pl.ground=false; pl.squash=1; burst(pl.x+PW/2,pl.y+PH,'#e2b6ff',10); }
      if(b.boost) pl.boost=1.3;
      if(b.ice) pl.ice=true;
      if(b.honey) pl.honey=true;
      if(b.conv) pl.conv=b.conv;
      if(b.music && fresh){ playNote(x+ty); pop(x*TILE+20,ty*TILE-6,'♪','#8fa6ff'); }
      if(b.vanish && !vanishQ.some(v=>v.x===x&&v.y===ty)) vanishQ.push({x,y:ty,t:.6,gone:false});
    } };
  const moveY=dy=>{ const prevB=pl.y+PH, was=pl.ground, impact=pl.vy; pl.y+=dy; const l=Math.floor(pl.x/TILE), r=Math.floor((pl.x+PW-1)/TILE); pl.ground=false;
    if(dy>0){ const ty=Math.floor((pl.y+PH)/TILE); for(let tx=l;tx<=r;tx++){ const b=BLOCKS[tileAt(tx,ty)];
        if((b?.solid&&!(b.door&&hasKey))||(b?.oneway&&prevB<=ty*TILE+1)){ pl.y=ty*TILE-PH; pl.vy=0; pl.ground=true; landed(ty,!was,impact); return; } } }
    else if(dy<0){ const ty=Math.floor(pl.y/TILE); for(let tx=l;tx<=r;tx++){ const ch=tileAt(tx,ty);
        if(BLOCKS[ch]?.solid&&!(BLOCKS[ch].door&&hasKey)){ pl.y=(ty+1)*TILE; pl.vy=0;
          if(BLOCKS[ch].lucky){ grid[ty][tx]='u'; const v=custom?Math.ceil(BLOCKS[ch].lucky/2):BLOCKS[ch].lucky; collected+=v; burst(tx*TILE+20,ty*TILE,'#ffd23f',16); pop(tx*TILE+20,ty*TILE-8,'+'+v); }
          return; } } } };
  const finish=()=>{
    finished=true;
    const t=Math.round(time*10)/10, first=!S.completed[level.id];
    let bonus;
    if(!custom) bonus=first?level.reward:Math.ceil(level.reward/2);
    else { bonus=Math.ceil((5+obbyBonus(level.tiles))/2); if(gl&&Math.abs(gl.x-sp.x)<15) bonus=1; }
    const perfect=deaths===0, perfectBonus=perfect?Math.ceil(bonus*.5):0;
    const base=bonus+perfectBonus+collected;
    if(first||t<S.completed[level.id]) S.completed[level.id]=t;
    const lvBefore=S.level;
    const got=earn(base, 15+collected+(custom?5:level.reward));
    setTimeout(()=>{
      $('#ov').innerHTML=`<div class="overlay"><div class="card result-card"><div class="cel-burst"></div><h2>🎉 You did it!</h2><p>⏱ ${t}s · 💥 ${deaths} falls</p>
      <div class="rows"><div><span>Coins picked up</span><b>${collected}</b></div><div><span>Finish bonus</span><b>+${bonus}</b></div>
      ${perfect?`<div><span>⭐ Perfect run (no falls)</span><b>+${perfectBonus}</b></div>`:''}
      <div><span>🚀 Level ${lvBefore} coin boost</span><b>×${coinBoost().toFixed(2)}</b></div></div>
      ${custom&&bonus===1?'<p class="muted">Tip: make your obby 15+ blocks long for a bigger bonus!</p>':''}
      <div class="earned">+${got} 🪙</div><div class="row center"><button class="btn" id="again">Play again</button><button class="btn ghost" id="done">Done</button></div></div></div>`;
      $('#again').onclick=()=>go('play',level); $('#done').onclick=back;
    },600);
  };
  const overlaps=()=>{
    const x0=Math.floor((pl.x+3)/TILE), x1=Math.floor((pl.x+PW-4)/TILE), y0=Math.floor((pl.y+3)/TILE), y1=Math.floor((pl.y+PH-2)/TILE);
    let inPortal=false;
    for(let ty=y0;ty<=y1;ty++) for(let tx=x0;tx<=x1;tx++){
      const b=BLOCKS[tileAt(tx,ty)]; if(!b) continue;
      if(b.hazard && pl.y+PH-2>ty*TILE+(b.spike?20:8)){ die(); return; }
      if(b.collect){ let v=b.collect; if(custom&&v>1) v=Math.ceil(v/2); collected+=v; grid[ty][tx]='.'; burst(tx*TILE+20,ty*TILE+20,b.color,12); pop(tx*TILE+20,ty*TILE+6,'+'+v); }
      if(b.checkpoint && cpKey!==tx+','+ty){ cpKey=tx+','+ty; spawn={x:tx*TILE+(TILE-PW)/2,y:(ty+1)*TILE-PH}; burst(tx*TILE+20,ty*TILE+10,'#3ddc97',16); pop(tx*TILE+20,ty*TILE,'Checkpoint!','#3ddc97'); }
      if(b.portal){ inPortal=true; const key=tx+','+ty;
        if(lastPortal!==key){ const i=portals.findIndex(p=>p.x===tx&&p.y===ty), to=portals[i^1];
          if(to){ burst(pl.x+PW/2,pl.y+PH/2,'#b58cff',16); pl.x=to.x*TILE+(TILE-PW)/2; pl.y=(to.y+1)*TILE-PH; pl.vy=0; lastPortal=to.x+','+to.y; burst(pl.x+PW/2,pl.y+PH/2,'#ff6fe8',16); return; } } }
      if(b.key){ hasKey=true; grid[ty][tx]='.'; burst(tx*TILE+20,ty*TILE+20,'#ffd23f',20); pop(tx*TILE+20,ty*TILE,'🔑 Doors open!','#ffd23f'); }
      if(b.goal && !finished){ burst(tx*TILE+20,ty*TILE+10,'#ff6fb5',40,420); burst(tx*TILE+20,ty*TILE+10,'#ffd23f',30,420); finish(); }
    }
    if(!inPortal) lastPortal=null;
  };
  const update=dt=>{
    if(!finished) time+=dt;
    const dir=(keys.right?1:0)-(keys.left?1:0);
    let max=pl.boost>0?450:200; if(pl.ground&&pl.honey) max*=.45;
    pl.boost=Math.max(0,pl.boost-dt);
    const acc=pl.ground?(pl.ice?700:2600):1700;
    if(dir&&!finished){ pl.vx+=dir*acc*dt; if(Math.abs(pl.vx)>max) pl.vx=Math.sign(pl.vx)*Math.max(max,Math.abs(pl.vx)-(pl.honey?4000:1200)*dt); pl.facing=dir; }
    else { const fr=(pl.ground?(pl.ice?250:2600):500)*dt; pl.vx=Math.abs(pl.vx)<=fr?0:pl.vx-Math.sign(pl.vx)*fr; }
    if(keys.jump&&!lastJump) pl.buffer=.12; lastJump=keys.jump;
    pl.buffer-=dt; pl.coyote=pl.ground?.1:pl.coyote-dt;
    if(pl.buffer>0&&pl.coyote>0&&!finished){ pl.vy=-JUMP*(pl.honey&&pl.ground?.7:1); pl.buffer=0; pl.coyote=0; pl.ground=false; dust(pl.x+PW/2,pl.y+PH); }
    if(!keys.jump&&pl.vy<-320&&pl.vy>-JUMP-10) pl.vy=-320;
    { const wc=tileAt(Math.floor((pl.x+PW/2)/TILE),Math.floor((pl.y+PH*.6)/TILE)); pl.swim=wc==='w'; }
    if(pl.swim){ pl.vy=Math.min(140,pl.vy+GRAV*.3*dt); pl.vx*=.985; if(pl.buffer>0){ pl.vy=-380; pl.buffer=0; } if(Math.random()<.08) parts.push({x:pl.x+PW/2,y:pl.y+8,vx:0,vy:-60,life:.8,max:.8,trail:'bubbles',r:2+Math.random()*2}); }
    else pl.vy=Math.min(950,pl.vy+GRAV*dt);
    // fans blow you upwards (up to 5 blocks above them)
    for (const cx of [Math.floor((pl.x+3)/TILE),Math.floor((pl.x+PW-3)/TILE)]){
      let found=false;
      for(let ty=Math.floor((pl.y+PH-1)/TILE); ty<ROWS && ty<=Math.floor((pl.y+PH)/TILE)+6; ty++){
        const ch=tileAt(cx,ty);
        if(ch==='F'){ if(ty*TILE-(pl.y+PH)<=5.2*TILE){ pl.vy=Math.max(pl.vy-3600*dt,-470); found=true; } break; }
        if(BLOCKS[ch]?.solid) break;
      }
      if(found){ if(Math.random()<.3) parts.push({x:pl.x+Math.random()*PW,y:pl.y+PH,vx:0,vy:-200,life:.3,max:.3,color:'rgba(255,255,255,.8)',g:0,dust:true}); break; }
    }
    moveX(pl.vx*dt); if(pl.ground&&pl.conv) moveX(pl.conv*130*dt); moveY(pl.vy*dt);
    if(pl.ground&&Math.abs(pl.vx)>10) pl.walk+=dt*14*(pl.honey?.5:1);
    overlaps();
    if(pl.y>VH+80) die();
    // vanish blocks
    for(let i=vanishQ.length-1;i>=0;i--){ const v=vanishQ[i]; v.t-=dt;
      if(!v.gone&&v.t<=0){ grid[v.y][v.x]='.'; v.gone=true; v.t=3; burst(v.x*TILE+20,v.y*TILE+20,'#c77dff',8); }
      else if(v.gone&&v.t<=0){ const over=pl.x+PW>v.x*TILE&&pl.x<v.x*TILE+TILE&&pl.y+PH>v.y*TILE&&pl.y<v.y*TILE+TILE; if(!over){ grid[v.y][v.x]='V'; vanishQ.splice(i,1); } } }
    if(S.avatar.trail!=='none'&&(Math.abs(pl.vx)>50||!pl.ground)&&Math.random()<.5){ const p=makeTrail(S.avatar.trail,pl.x+PW/2,pl.y+PH-14); if(p) parts.push(p); }
    for(const p of parts){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=600*dt*(p.g??0); p.life-=dt; }
    for(let i=parts.length-1;i>=0;i--) if(parts[i].life<=0) parts.splice(i,1);
    for(const p of pops){ p.y-=40*dt; p.life-=dt; } for(let i=pops.length-1;i>=0;i--) if(pops[i].life<=0) pops.splice(i,1);
    flash=Math.max(0,flash-dt); shake=Math.max(0,shake-dt); pl.squash=Math.max(0,pl.squash-dt*5);
    // pet follows
    const tx=pl.x+PW/2-pl.facing*30, ty2=pl.y+PH; pet.x+=(tx-pet.x)*Math.min(1,dt*6); pet.y+=(ty2-pet.y)*Math.min(1,dt*6);
  };
  const render=t=>{
    const target=Math.max(0,Math.min(W*TILE-VW,pl.x+PW/2-VW/2+pl.facing*60));
    camX+=(target-camX)*.12; if(Math.abs(target-camX)>600) camX=target;
    const sx=shake>0?(Math.random()-.5)*12*shake/.35:0, sy=shake>0?(Math.random()-.5)*12*shake/.35:0;
    drawSky(ctx,VW,VH,camX,t,level.theme||'day');
    ctx.save(); ctx.translate(-Math.round(camX)+sx,sy);
    const x0=Math.max(0,Math.floor(camX/TILE)-1), x1=Math.min(W-1,Math.ceil((camX+VW)/TILE));
    // lava glow
    ctx.save(); ctx.globalCompositeOperation='lighter';
    for(let ty=0;ty<ROWS;ty++) for(let tx=x0;tx<=x1;tx++) if(grid[ty][tx]==='L'&&tileAt(tx,ty-1)!=='L'){ const g=ctx.createLinearGradient(0,ty*TILE+10,0,ty*TILE-60); g.addColorStop(0,`rgba(255,120,40,${.28+.06*Math.sin(t*3+tx)})`); g.addColorStop(1,'rgba(255,120,40,0)'); ctx.fillStyle=g; ctx.fillRect(tx*TILE,ty*TILE-60,TILE,70); }
    ctx.restore();
    // soft shadows under solid blocks
    ctx.fillStyle='rgba(20,10,40,.12)';
    for(let ty=0;ty<ROWS;ty++) for(let tx=x0;tx<=x1;tx++){ const b=BLOCKS[grid[ty][tx]]; if(b?.solid&&!BLOCKS[tileAt(tx,ty+1)]?.solid) ctx.fillRect(tx*TILE+4,ty*TILE+TILE,TILE-2,6); }
    for(let ty=0;ty<ROWS;ty++) for(let tx=x0;tx<=x1;tx++){ const ch=grid[ty][tx];
      if(ch==='.'){ if(vanishQ.some(v=>v.gone&&v.x===tx&&v.y===ty)){ ctx.setLineDash([4,4]); ctx.strokeStyle='rgba(199,125,255,.5)'; ctx.strokeRect(tx*TILE+3,ty*TILE+3,TILE-6,TILE-6); ctx.setLineDash([]); } continue; }
      if(ch==='K'&&cpKey===tx+','+ty){ ctx.fillStyle='rgba(61,220,151,.25)'; ctx.beginPath(); ctx.arc(tx*TILE+20,ty*TILE+20,22,0,7); ctx.fill(); }
      const warn=ch==='V'&&vanishQ.some(v=>!v.gone&&v.x===tx&&v.y===ty);
      if(ch==='d'&&hasKey) ctx.globalAlpha=.22;
      drawBlock(ctx,ch,tx*TILE+(warn?(Math.random()-.5)*3:0),ty*TILE,t); ctx.globalAlpha=1;
      if(ch==='#'&&tileAt(tx,ty-1)==='.'){ const hs=(tx*73+ty*31)%9; const sw=Math.sin(t*2+tx)*1.2;
        if(hs<3){ ctx.strokeStyle='#3fae4c'; ctx.lineWidth=1.6; for(const dx of [8,12,16]){ ctx.beginPath(); ctx.moveTo(tx*TILE+dx+hs*6,ty*TILE+2); ctx.lineTo(tx*TILE+dx+hs*6+sw,ty*TILE-6); ctx.stroke(); } }
        else if(hs===4||hs===7){ const fx=tx*TILE+12+hs*2, fy=ty*TILE-9; ctx.strokeStyle='#3a9a4a'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(fx,ty*TILE+2); ctx.lineTo(fx+sw,fy); ctx.stroke(); ctx.fillStyle=hs===4?'#ff7eb3':'#ffe066'; for(let k=0;k<5;k++){ const g=k/5*6.28; ctx.beginPath(); ctx.arc(fx+sw+Math.cos(g)*2.6,fy+Math.sin(g)*2.6,2,0,7); ctx.fill(); } ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(fx+sw,fy,1.4,0,7); ctx.fill(); } } }
    for(const p of parts) drawParticle(ctx,p);
    drawPet(ctx,pet.x,pet.y,S.avatar.pet,t,pl.facing,.95);
    const sq=pl.squash, stretch=!pl.ground&&pl.vy<-300?.12:0;
    ctx.save(); ctx.translate(pl.x+PW/2,pl.y+PH); ctx.scale(1+sq*.25-stretch*.5,1-sq*.22+stretch);
    drawAvatar(ctx,0,0,S.avatar,{scale:.92,facing:pl.facing,walk:pl.walk,arms:!pl.ground,t,shadow:pl.ground});
    ctx.restore();
    ctx.font='700 18px Fredoka,sans-serif'; ctx.textAlign='center';
    for(const p of pops){ ctx.globalAlpha=Math.min(1,p.life*2); ctx.lineWidth=4; ctx.strokeStyle='rgba(40,20,60,.6)'; ctx.strokeText(p.text,p.x,p.y); ctx.fillStyle=p.color; ctx.fillText(p.text,p.x,p.y); }
    ctx.globalAlpha=1;
    ctx.restore();
    if(flash>0){ ctx.fillStyle=`rgba(255,80,60,${flash})`; ctx.fillRect(0,0,VW,VH); }
    const vg=ctx.createRadialGradient(VW/2,VH/2,VH*.45,VW/2,VH/2,VW*.65); vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(20,10,40,.22)'); ctx.fillStyle=vg; ctx.fillRect(0,0,VW,VH);
    // HUD
    ctx.fillStyle='rgba(30,20,60,.6)'; rr(ctx,12,12,360,42,21); ctx.fill();
    ctx.fillStyle='#ffd23f'; ctx.beginPath(); ctx.arc(36,33,10,0,7); ctx.fill(); ctx.fillStyle='#fff3a0'; ctx.beginPath(); ctx.arc(34,31,5,0,7); ctx.fill();
    ctx.font='600 18px Fredoka,sans-serif'; ctx.textAlign='left'; ctx.fillStyle='#fff';
    ctx.fillText(`${collected}     ⏱ ${time.toFixed(1)}s     💥 ${deaths}     ⭐${S.level}${hasKey?'   🔑':''}`,54,39);
    const label=`${level.emoji||'🧱'} ${level.name}`; const lw=ctx.measureText(label).width+32;
    ctx.fillStyle='rgba(30,20,60,.6)'; rr(ctx,VW-12-lw,12,lw,42,21); ctx.fill(); ctx.fillStyle='#fff'; ctx.textAlign='right'; ctx.fillText(label,VW-28,40);
    if(pl.boost>0){ ctx.textAlign='center'; ctx.font='700 22px Fredoka,sans-serif'; ctx.fillStyle='#ff9f1c'; ctx.strokeStyle='#fff'; ctx.lineWidth=4; ctx.strokeText('⚡ SPEED BOOST ⚡',VW/2,86); ctx.fillText('⚡ SPEED BOOST ⚡',VW/2,86); }
  };
  const stop=loop((dt,t)=>{ update(dt/2); update(dt/2); render(t); });
  const unkey=keyboard(keys,e=>{ if(e.key==='Escape') back(); });
  cleanup=()=>{ stop(); unkey(); };
};

   GAME 2: CITY
   ========================================================= */
const CW=14, CH=9;
function cityState(){
  if(!S.city){ const grid=Array.from({length:CH},()=>Array.from({length:CW},()=>({t:null})));
    for(let x=0;x<CW;x++) grid[4][x]={t:'road'}; grid[3][3]={t:'house',c:'#ff7eb3'}; grid[5][5]={t:'park'}; grid[3][8]={t:'tree'};
    S.city={grid,last:Date.now(),name:'Sunny City'}; save(); }
  return S.city;
}
function cityStats(city){
  const g=city.grid; let pop=0,jobs=0,happyBonus=0,income=0,noRoad=0;
  const road=(x,y)=>g[y]?.[x]?.t==='road';
  for(let y=0;y<CH;y++) for(let x=0;x<CW;x++){
    const it=CITY[g[y][x].t]; if(!it||g[y][x].t==='road') continue;
    happyBonus+=it.happy||0;
    if(it.pop||it.income||it.jobs){
      if(road(x-1,y)||road(x+1,y)||road(x,y-1)||road(x,y+1)){ pop+=it.pop||0; jobs+=it.jobs||0; income+=it.income||0; } else noRoad++;
    }
  }
  const happy=Math.max(10,Math.min(100,40+happyBonus-noRoad*5-Math.max(0,pop-jobs*3)/4));
  const perMin=Math.round(income*happy/100*10)/10;
  return {pop,jobs,happy:Math.round(happy),perMin,noRoad};
}
