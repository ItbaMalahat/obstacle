    b.appendChild(it.emoji?Object.assign(document.createElement('div'),{textContent:it.emoji,style:'font-size:26px;height:36px'}):miniCanvas(36,c=>{ c.fillStyle='#7ed36b'; c.fillRect(0,0,36,36); drawCity(c,{t:id,c:CITY_COLORS[0]},0,id==='tower'?8:0,id==='tower'?28:36,0,{l:1,r:1}); }));
    b.insertAdjacentHTML('beforeend',`<span>${it.name}</span>${ok?'':`<span class="price">🔒 ${it.price}</span>`}`);
    b.onclick=()=>{ if(!ok) return toast(`Unlock ${it.name} in the shop for ${it.price} 🪙`); tool=id; $$('.pal').forEach(p=>p.classList.toggle('on',p.dataset.id===id)); };
    pal.appendChild(b);
  });
  $('.pal[data-id="road"]').classList.add('on');
  $('#cols').innerHTML=CITY_COLORS.map(c=>`<button class="swatch ${c===color?'on':''}" style="background:${c}" data-c="${c}" aria-label="colour ${c}"></button>`).join('');
  $$('#cols .swatch').forEach(s=>s.onclick=()=>{ color=s.dataset.c; $$('#cols .swatch').forEach(x=>x.classList.toggle('on',x===s)); });
  const canvas=$('#cv'), ctx=setupCanvas(canvas,VW,VH);
  const cars=[];
  const pending=()=>{ const st=cityStats(city); return Math.min(Math.floor(st.perMin*60), Math.floor((Date.now()-city.last)/60000*st.perMin)); };
  const refresh=()=>{
    const st=cityStats(city);
    $('#stats').innerHTML=`<span class="stat">👥 ${st.pop} people</span><span class="stat">💼 ${st.jobs} jobs</span><span class="stat">😊 ${st.happy}% happy</span><span class="stat">🪙 ${st.perMin}/min</span>`;
    $('#tip').textContent=st.noRoad?`${st.noRoad} building(s) need a road next to them!`:st.happy<50?'Add parks, trees and fountains to make people happier.':'Your city earns coins even while you play other games!';
  };
  const updCollect=()=>{ const p=pending(); const b=$('#collect'); b.textContent=`💰 Collect ${p} coins`; b.disabled=p<1; };
  $('#collect').onclick=()=>{ const p=pending(); if(p<1) return; const got=earn(p,p); city.last=Date.now(); save(); toast(`+${got} 🪙 from ${city.name}!`); updCollect(); };
  canvas.onclick=e=>{
    const p=canvasPos(e,canvas,VW,VH), x=Math.floor(p.x/S2), y=Math.floor(p.y/S2);
    if(x<0||y<0||x>=CW||y>=CH) return;
    const cell=city.grid[y][x];
    if(tool==='erase') city.grid[y][x]={t:null};
    else if(cell.t===tool && CITY[tool].colorable) cell.c=color;
    else if(cell.t===tool) city.grid[y][x]={t:null};
    else city.grid[y][x]={t:tool,c:color};
    save(); refresh();
  };
  refresh(); updCollect();
  const iv=setInterval(updCollect,2000);
  const stop=loop((dt,t)=>{
    const g=city.grid;
    for(let y=0;y<CH;y++) for(let x=0;x<CW;x++) drawGrass(ctx,x*S2,y*S2,S2,x,y,'#7ed36b','#76cc63');
    const isRoad=(x,y)=>g[y]?.[x]?.t==='road';
    const roads=[]; for(let y=0;y<CH;y++) for(let x=0;x<CW;x++) if(isRoad(x,y)) roads.push([x,y]);
    for(const [x,y] of roads) drawCity(ctx,g[y][x],x*S2,y*S2,S2,t,{l:isRoad(x-1,y),r:isRoad(x+1,y),u:isRoad(x,y-1),d:isRoad(x,y+1)});
    // cars drive along roads
    const want=Math.min(10,Math.floor(roads.length/3));
    while(cars.length<want&&roads.length){ const [x,y]=pick(roads); cars.push({x,y,tx:x,ty:y,p:1,c:pick(['#ef3b4a','#4fa3ff','#ffd23f','#ffffff','#7b3fe4'])}); }
    cars.length=Math.min(cars.length,want);
    for(const car of cars){
      if(!isRoad(car.tx,car.ty)){ const r=pick(roads); if(!r) break; car.x=car.tx=r[0]; car.y=car.ty=r[1]; car.p=1; }
      car.p+=dt*1.6;
      if(car.p>=1){ car.x=car.tx; car.y=car.ty; car.p=0;
        const opts=[[1,0],[-1,0],[0,1],[0,-1]].filter(([dx,dy])=>isRoad(car.x+dx,car.y+dy));
        const fwd=opts.filter(([dx,dy])=>!(car.x+dx===car.px&&car.y+dy===car.py));
        const [dx,dy]=pick(fwd.length?fwd:opts.length?opts:[[0,0]]); car.px=car.x; car.py=car.y; car.tx=car.x+dx; car.ty=car.y+dy; }
      const cx=(car.x+(car.tx-car.x)*car.p)*S2+S2/2, cy=(car.y+(car.ty-car.y)*car.p)*S2+S2/2;
      const horiz=car.tx!==car.x;
      ctx.fillStyle=car.c; rr(ctx,cx-(horiz?10:6),cy-(horiz?6:10),horiz?20:12,horiz?12:20,4); ctx.fill();
      ctx.fillStyle='rgba(150,220,255,.9)'; ctx.fillRect(cx-4,cy-4,8,8);
    }
    for(let y=0;y<CH;y++) for(let x=0;x<CW;x++){ const c=g[y][x]; if(c.t&&c.t!=='road') drawCity(ctx,c,x*S2,y*S2,S2,t); }
  });
  cleanup=()=>{ stop(); clearInterval(iv); };
};

const FW=14, FH=9;
function forestState(){
  if(!S.forest){ const grid=[];
    for(let y=0;y<FH;y++){ const r=[]; for(let x=0;x<FW;x++){ const edge=x<2||x>FW-3||y<1||y>FH-2; r.push({t:(edge||Math.random()<.45)?'tree':(Math.random()<.08?'flowers':null)}); } grid.push(r); }
    for(let x=4;x<10;x++) for(let y=3;y<6;y++) grid[y][x]={t:null};
    grid[4][5]={t:'cottage',c:'#ffb84f'}; grid[4][6]={t:'path'}; grid[4][7]={t:'path'};
    S.forest={grid,people:[],name:'Whispering Woods'}; save(); }
  return S.forest;
}
function forestBeds(f){ let b=0; for(const r of f.grid) for(const c of r) b+=FOREST[c.t]?.beds||0; return b; }
function homesList(f){ const h=[]; f.grid.forEach((r,y)=>r.forEach((c,x)=>{ if(FOREST[c.t]?.beds) h.push({x,y,t:c.t}); })); return h; }
SCREENS.forest=()=>{

    b.onclick=()=>{ if(!ok) return toast(`Unlock ${it.name} in the shop for ${it.price} 🪙`); tool=id; $$('.pal').forEach(p=>p.classList.toggle('on',p.dataset.id===id)); };
    pal.appendChild(b);
  });

  $('#cols').innerHTML=CITY_COLORS.map(c=>`<button class="swatch ${c===color?'on':''}" style="background:${c}" data-c="${c}" aria-label="colour ${c}"></button>`).join('');
  $$('#cols .swatch').forEach(s=>s.onclick=()=>{ color=s.dataset.c; $$('#cols .swatch').forEach(x=>x.classList.toggle('on',x===s)); });

  const walkable=(x,y)=>{ const c=f.grid[y]?.[x]; return c && !['tree','pond','campfire'].includes(c.t); };
  // walkers: runtime positions for people
  const walkers=f.people.map(p=>spawnWalker(p));
  function spawnWalker(p){ const homes=homesList(f); const h=homes[f.people.indexOf(p)%Math.max(1,homes.length)]||{x:6,y:4};
    return {p,x:h.x*S2+S2/2,y:h.y*S2+S2-4,tx:null,ty:null,wait:Math.random()*2,walk:0,facing:1,bubble:null}; }
  const refreshPeople=()=>{

    $('#cap').textContent=`(${f.people.length}/${beds} beds)`;
    const box=$('#people'); box.innerHTML='';
    if(!f.people.length) box.innerHTML='<p class="muted">Nobody lives here yet. Design your first neighbour!</p>';
    f.people.forEach((p,i)=>{ const b=document.createElement('button'); b.className='person'; b.appendChild(avatarCanvas(p,44)); b.insertAdjacentHTML('beforeend',`<b style="flex:1">${esc(p.name)}</b><span class="btn small ghost" data-edit>✏️</span><span class="btn small ghost" data-del>👋</span>`);
      b.onclick=e=>{ if(e.target.dataset.del!==undefined){ if(confirm(`Say goodbye to ${p.name}?`)){ f.people.splice(i,1); walkers.splice(i,1); save(); refreshPeople(); } return; }
        if(e.target.dataset.edit!==undefined){ editPerson(i); return; } sayHi(i); };

  const LINES=['Hi! I love it here! 🌳','What a lovely day! ☀️','Have you seen the ducks? 🦆','I just baked cookies 🍪','Let\'s go exploring! 🍄','Nice to meet you! 💖'];
  const sayHi=i=>{ const w=walkers[i]; if(!w) return; w.bubble={text:pick(LINES),t:3}; $('#sel').textContent=`${f.people[i].name} says hello!`; };
  const editPerson=i=>go('creator',{avatar:f.people[i],title:`Edit ${f.people[i].name}`,person:true,onDone:av=>{ f.people[i]=av; save(); go('forest'); },onBack:()=>go('forest')});
  $('#add').onclick=()=>{
    if(f.people.length>=forestBeds(f)) return toast('Build another home first! Every home has beds for 2-3 people 🏡');
    go('creator',{avatar:randomPerson(),title:'Design a neighbour',person:true,onDone:av=>{ f.people.push(av); let msg=`${av.name} moved in! 🏡`; if(S.welcomed<30){ S.welcomed++; msg+=' +'+earn(10,15)+' 🪙'; } save(); toast(msg); go('forest'); },onBack:()=>go('forest')});
  };
  const canvas=$('#cv'), ctx=setupCanvas(canvas,VW,VH);
  canvas.onclick=e=>{
    const p=canvasPos(e,canvas,VW,VH);
    // tap a person?
    for(let i=walkers.length-1;i>=0;i--){ const w=walkers[i]; if(Math.abs(p.x-w.x)<16&&p.y<w.y&&p.y>w.y-36){ sayHi(i); return; } }
    const x=Math.floor(p.x/S2), y=Math.floor(p.y/S2); if(x<0||y<0||x>=FW||y>=FH) return;
    const cell=f.grid[y][x];
    if(tool==='axe'){ if(cell.t==='tree'||cell.t==='flowers'||cell.t==='path'||cell.t==='garden'){ f.grid[y][x]={t:null}; } else if(cell.t){
        if(FOREST[cell.t].beds && f.people.length>forestBeds(f)-FOREST[cell.t].beds) return toast('Someone lives there! Say goodbye to a neighbour first.');
        f.grid[y][x]={t:null}; } }
    else if(tool==='plant'){ if(cell.t) return toast('Clear this spot first'); f.grid[y][x]={t:'tree'}; }
    else { if(cell.t==='tree') return toast('Chop the tree first with the 🪓 Axe!');
      if(cell.t===tool&&tool==='cottage') cell.c=color;
      else if(cell.t&&FOREST[cell.t]?.beds && f.people.length>forestBeds(f)-FOREST[cell.t].beds) return toast('Someone lives there!');
      else f.grid[y][x]={t:tool,c:color}; }
    save(); refreshPeople();
  };
  refreshPeople();
  const fireflies=Array.from({length:14},()=>({x:Math.random()*VW,y:Math.random()*VH,a:Math.random()*6}));
  cleanup=loop((dt,t)=>{
    for(let y=0;y<FH;y++) for(let x=0;x<FW;x++) drawGrass(ctx,x*S2,y*S2,S2,x,y,'#5aa457','#62ad5e');
    for(let y=0;y<FH;y++) for(let x=0;x<FW;x++){ const c=f.grid[y][x]; if(c.t==='path'||c.t==='garden'||c.t==='flowers'||c.t==='pond') drawForest(ctx,c,x*S2,y*S2,S2,t,x,y); }
    // people walk, then draw everything sorted by row so things overlap nicely
    const draws=[];
    for(let y=0;y<FH;y++) for(let x=0;x<FW;x++){ const c=f.grid[y][x]; if(c.t&&!['path','garden','flowers','pond'].includes(c.t)) draws.push({z:y*S2+S2,fn:()=>drawForest(ctx,c,x*S2,y*S2,S2,t,x,y)}); }
    walkers.forEach((w,i)=>{
      if(w.tx===null){ w.wait-=dt; if(w.wait<=0){ const cx=Math.floor(w.x/S2), cy=Math.floor(w.y/S2);
          const opts=[[1,0],[-1,0],[0,1],[0,-1]].map(([dx,dy])=>[cx+dx,cy+dy]).filter(([a,b])=>walkable(a,b));
          if(opts.length){ const [a,b]=pick(opts); w.tx=a*S2+S2/2; w.ty=b*S2+S2-4; } else w.wait=1; } }
      else { const dx=w.tx-w.x, dy=w.ty-w.y, d=Math.hypot(dx,dy);
        if(d<2){ w.x=w.tx; w.y=w.ty; w.tx=null; w.wait=.5+Math.random()*2.5; }
        else { const sp=45*dt; w.x+=dx/d*sp; w.y+=dy/d*sp; w.walk+=dt*10; if(Math.abs(dx)>1) w.facing=Math.sign(dx); } }
      if(w.bubble){ w.bubble.t-=dt; if(w.bubble.t<=0) w.bubble=null; }
      draws.push({z:w.y,fn:()=>{
        drawAvatar(ctx,w.x,w.y,w.p,{scale:.78,facing:w.facing,walk:w.tx===null?0:w.walk});
        ctx.font='600 11px Fredoka,sans-serif'; ctx.textAlign='center'; const tw=ctx.measureText(w.p.name).width+8;
        ctx.fillStyle='rgba(0,0,0,.45)'; rr(ctx,w.x-tw/2,w.y-50,tw,14,7); ctx.fill(); ctx.fillStyle='#fff'; ctx.fillText(w.p.name,w.x,w.y-39);
        if(w.bubble){ ctx.font='600 13px Fredoka,sans-serif'; const bw=ctx.measureText(w.bubble.text).width+16; const bx=Math.max(4,Math.min(VW-bw-4,w.x-bw/2));
          ctx.fillStyle='#fff'; rr(ctx,bx,w.y-82,bw,26,12); ctx.fill(); ctx.fillStyle='#2b2150'; ctx.fillText(w.bubble.text,bx+bw/2,w.y-64); }
      }});
    });
    draws.sort((a,b)=>a.z-b.z).forEach(d=>d.fn());
    for(const ff of fireflies){ ff.a+=dt; ff.x+=Math.cos(ff.a*.7)*10*dt; ff.y+=Math.sin(ff.a)*8*dt; ctx.fillStyle=`rgba(255,240,140,${.4+.4*Math.sin(ff.a*3)})`; ctx.beginPath(); ctx.arc(ff.x,ff.y,2,0,7); ctx.fill(); }
  });
};

SCREENS.fun=()=>{
  const VW=960, VH=480, GROUND=430;
  const roster=[{...S.avatar, you:true}];
  if(S.avatar.preset!=='aliha') roster.push(PRESETS.aliha);
  if(S.avatar.preset!=='idba') roster.push(PRESETS.idba);
  for(const p of (S.forest?.people||[]).slice(0,8)) roster.push(p);
  const plats=[{x:90,y:330,w:170},{x:390,y:250,w:150},{x:700,y:320,w:180},{x:560,y:160,w:110}];
  const tramp={x:290,w:80};
  const chars=roster.map((a,i)=>({a,x:80+i*(800/roster.length),y:GROUND,vx:0,vy:0,ground:true,facing:1,walk:0,ai:{t:Math.random()*2,dir:0},emote:null,say:null}));
  let selIdx=0;
  const ball={x:480,y:200,vx:60,vy:0,r:14,spin:0};
  const keys={left:false,right:false,jump:false};
  app.innerHTML=`<div class="row"><button class="btn ghost small" id="back">← Home</button><h1>🎈 Play Around</h1></div>
  <p class="muted" style="margin-top:0">Tap a character to control them. Bounce on the trampoline, kick the ball, and make them dance! Neighbours you design in the forest come to play too.</p>
  <div class="canvas-wrap"><canvas class="game" id="cv"></canvas></div>
  <div class="touch ${isTouch()?'on':''}"><div class="row"><button class="tbtn" data-hold="left">◀</button><button class="tbtn" data-hold="right">▶</button></div><button class="tbtn jump" data-hold="jump">⤒</button></div>
  <div class="fun-actions"><button class="btn small" data-emote="wave">👋 Wave</button><button class="btn small" data-emote="dance">💃 Dance</button><button class="btn small" data-emote="cheer">🙌 Cheer</button><button class="btn small" data-emote="spin">🌀 Spin</button>
    <button class="btn small pink" id="say">💬 Say something</button><button class="btn small ghost" id="next">🔄 Next character</button><button class="btn small ghost" id="party">🎉 Party time!</button></div>
  <div class="row" style="margin-top:12px" id="who"></div>`;
  $('#back').onclick=()=>go('hub');
  holdButtons(keys);
  const who=$('#who');
  const refreshWho=()=>{ who.innerHTML=''; chars.forEach((c,i)=>{ const b=document.createElement('button'); b.className=`chip ${i===selIdx?'on':''}`; b.style.display='flex'; b.style.alignItems='center'; b.style.gap='4px'; b.appendChild(avatarCanvas(c.a,32)); b.append(c.a.name+(c.a.you?' (you)':'')); b.onclick=()=>{ selIdx=i; refreshWho(); }; who.appendChild(b); }); };
  refreshWho();
  const emote=(c,type)=>{ c.emote={type,t:type==='spin'?1:2}; if(type==='cheer'&&c.ground){ c.vy=-600; c.ground=false; } };
  $$('[data-emote]').forEach(b=>b.onclick=()=>emote(chars[selIdx],b.dataset.emote));
  $('#say').onclick=()=>{ const txt=prompt(`What should ${chars[selIdx].a.name} say?`,'Hello friends!'); if(txt) chars[selIdx].say={text:txt.slice(0,40),t:4}; };
  $('#next').onclick=()=>{ selIdx=(selIdx+1)%chars.length; refreshWho(); };
  $('#party').onclick=()=>{ const lines=['Yay! 🎉','Woohoo!','Party! 🥳','I love this! 💖','Dance time! 💃']; chars.forEach((c,i)=>setTimeout(()=>{ emote(c,pick(['dance','cheer','spin'])); c.say={text:pick(lines),t:2.5}; },i*150)); confetti=120; };
  let confetti=0; const bits=[], tparts=[];
  const canvas=$('#cv'), ctx=setupCanvas(canvas,VW,VH);
  canvas.onpointerdown=e=>{ const p=canvasPos(e,canvas,VW,VH); let best=-1,bd=50; chars.forEach((c,i)=>{ const d=Math.hypot(c.x-p.x,c.y-22-p.y); if(d<bd){ bd=d; best=i; } }); if(best>=0){ selIdx=best; refreshWho(); } };
  const surfaceBelow=(c,prevY)=>{ // returns y of platform the character lands on, or null
    for(const p of plats) if(c.x>p.x-6&&c.x<p.x+p.w+6&&prevY<=p.y+1&&c.y>=p.y) return p.y;
    return c.y>=GROUND?GROUND:null; };
  let lastJump=false;
  const step=(dt)=>{
    chars.forEach((c,i)=>{
      let dir=0, jump=false;
      if(i===selIdx){ dir=(keys.right?1:0)-(keys.left?1:0); jump=keys.jump&&!lastJump; }
      else { c.ai.t-=dt; if(c.ai.t<=0){ c.ai.t=1+Math.random()*3; c.ai.dir=pick([-1,0,0,1]); if(Math.random()<.3) c.ai.jump=true; if(Math.random()<.12) emote(c,pick(['wave','dance','spin'])); } dir=c.ai.dir; if(c.ai.jump){ jump=true; c.ai.jump=false; } }
      if(c.emote?.type==='dance') dir=0;
      c.vx=dir*150; if(dir) c.facing=dir;
      if(jump&&c.ground){ c.vy=-680; c.ground=false; }
      const prevY=c.y; c.vy+=1900*dt; c.x+=c.vx*dt; c.y+=c.vy*dt;
      c.x=Math.max(14,Math.min(VW-14,c.x)); if(c.x<=14||c.x>=VW-14) c.ai.dir*=-1;
      c.ground=false;
      if(c.vy>=0){ const s=surfaceBelow(c,prevY); if(s!==null){ c.y=s; c.vy=0; c.ground=true;
          if(s===GROUND&&c.x>tramp.x&&c.x<tramp.x+tramp.w){ c.vy=-1000; c.ground=false; } } }
      if(c.ground&&dir) c.walk+=dt*14;
      if(c.emote){ c.emote.t-=dt; if(c.emote.type==='dance'){ c.facing=Math.sin(c.emote.t*12)>0?1:-1; c.walk+=dt*20; } if(c.emote.t<=0) c.emote=null; }
      if(c.say){ c.say.t-=dt; if(c.say.t<=0) c.say=null; }
      // kick the ball
      if(Math.hypot(ball.x-c.x,ball.y-(c.y-18))<ball.r+16){ ball.vx=(ball.x>c.x?1:-1)*(280+Math.random()*120); ball.vy=-420; }

function coderUI(box,{palette,loop=false,maxCount=9}){
  const prog=[]; let loops=1;
  box.innerHTML=`<div class="code-strip" aria-label="Your code"></div>
    ${loop?`<div class="loop-row"><span>🔁 Repeat my code</span><button class="btn small ghost" data-l="-1" aria-label="fewer">−</button><b class="loop-n">1</b><span>time(s)</span><button class="btn small ghost" data-l="1" aria-label="more">+</button></div>`:''}
    <div class="code-pal">${palette.map(p=>`<button class="cblock big" style="--c:${p.color}" data-add="${p.id}" aria-label="${p.label}"><span class="ic">${p.icon}</span><small>${p.label}</small></button>`).join('')}</div>
    <div class="row"><button class="btn small ghost" data-act="undo">↩️ Undo</button><button class="btn small ghost" data-act="clear">🗑️ Clear</button>${palette.some(p=>p.countable)?'<span class="muted small-tip">Tip: tap a block in your code to make it repeat!</span>':''}</div>`;
  const strip=box.querySelector('.code-strip');
  const draw=()=>{
    strip.innerHTML = prog.length ? prog.map((b,i)=>{ const p=palette.find(q=>q.id===b.id);
      return `<button class="cblock" style="--c:${p.color}" data-i="${i}"><span class="ic">${p.icon}</span>${p.countable?`<span class="cnt">×${b.n}</span>`:''}<span class="x" data-del="${i}" aria-label="remove">✕</span></button>`; }).join('<span class="arrow">›</span>')
      : '<span class="muted empty">Tap the blocks below to build your code! 👇</span>';
    const ln=box.querySelector('.loop-n'); if(ln) ln.textContent=loops;
  };
  box.addEventListener('click',e=>{
    if(box.classList.contains('busy')) return;
    if(e.target.dataset && e.target.dataset.del!==undefined){ prog.splice(+e.target.dataset.del,1); draw(); return; }
    const t=e.target.closest('button'); if(!t) return;
    if(t.dataset.add){ if(prog.length>=14) return toast('Wow, lots of code! Press ▶ Go to try it.'); prog.push({id:t.dataset.add,n:1}); draw(); return; }
    if(t.dataset.i!==undefined){ const b=prog[+t.dataset.i], p=palette.find(q=>q.id===b.id); if(p.countable){ b.n=b.n>=maxCount?1:b.n+1; draw(); } return; }
    if(t.dataset.l){ loops=Math.max(1,Math.min(6,loops+(+t.dataset.l))); draw(); return; }
    if(t.dataset.act==='undo'){ prog.pop(); draw(); }
    if(t.dataset.act==='clear'){ prog.length=0; loops=1; draw(); }
  });
  draw();
  return { get blocks(){ return prog.length; }, busy(b){ box.classList.toggle('busy',b); },
    steps(){ const out=[]; for(let k=0;k<loops;k++) for(const b of prog) for(let j=0;j<b.n;j++) out.push(b.id); return out; } };
}

SCREENS.art=(ai=0)=>{

  <div class="code-wrap"><div><div class="canvas-wrap code-board paper"><canvas class="game" id="cv"></canvas><div id="ov"></div></div>

    <div class="card coder"><h3 style="margin:0 0 6px">🧩 Your code</h3><div id="coder"></div><button class="btn green big go" id="go">▶ Draw!</button></div></div>`;
  $('#hav').appendChild(avatarCanvas(helperAvatar(),70));
  $('#back').onclick=()=>go('hub');
  $$('[data-a]').forEach(b=>b.onclick=()=>go('art',+b.dataset.a));
  const palette=[{id:'F',icon:'⬆️',label:'Forward',color:'#3ec46d',countable:true},{id:'R',icon:'↪️',label:'Turn right',color:'#4fa3ff'},{id:'L',icon:'↩️',label:'Turn left',color:'#c86bff'},{id:'C',icon:'🎨',label:'Colour',color:'#ff5fa2'}];
  if(A.free) palette.splice(3,0,{id:'D',icon:'↗️',label:'Half turn',color:'#ff9f1c'});
  const coder=coderUI($('#coder'),{palette,loop:!!A.loop});
  const canvas=$('#cv'), ctx=setupCanvas(canvas,VW,VH);
  const DX=[0,1,1,1,0,-1,-1,-1], DY=[-1,-1,0,1,1,1,0,-1];
  const COLS=['#ff5fa2','#4fa3ff','#3ec46d','#ff9f1c','#7b3fe4','#ffd23f','#e8364f'];
  const simulate=steps=>{ let x=start.x,y=start.y,d=0,ci=0; const segs=[];
    for(const s of steps){ if(s==='F'){ const nx=x+DX[d], ny=y+DY[d]; segs.push({x1:x,y1:y,x2:nx,y2:ny,c:COLS[ci%COLS.length]}); x=nx; y=ny; }
      else if(s==='R') d=(d+2)%8; else if(s==='L') d=(d+6)%8; else if(s==='D') d=(d+1)%8; else if(s==='C') ci++; }
    return {segs,x,y,d}; };
  const key=s=>{ const a=s.x1+','+s.y1, b=s.x2+','+s.y2; return a<b?a+'|'+b:b+'|'+a; };
  const target=A.target?simulate(A.target).segs:[];

    const steps=coder.steps(); if(!steps.length) return say('Tap some blocks first! 👇');
    coder.busy(true); $('#go').disabled=true; drawn=[]; Object.assign(turtle,{x:start.x,y:start.y,d:0});
    let x=start.x,y=start.y,d=0,ci=0;
    for(const s of steps){
      if(dead) return;
      if(s==='F'){ const nx=x+DX[d], ny=y+DY[d]; if(nx<0||ny<0||nx>N||ny>N){ say('Whoa, that goes off the paper! 📄'); break; } drawn.push({x1:x,y1:y,x2:nx,y2:ny,c:COLS[ci%COLS.length],p:0}); x=nx; y=ny; }
      else if(s==='R') d=(d+2)%8; else if(s==='L') d=(d+6)%8; else if(s==='D') d=(d+1)%8; else if(s==='C') ci++;
      Object.assign(turtle,{x,y,d}); await sleep(s==='F'?260:180);
    }
    if(dead) return;
    coder.busy(false); $('#go').disabled=false;
    if(A.free){ if(drawn.length>=6){ say('What a beautiful drawing! 🖼️'); if(!S.artDone[ai]){ S.artDone[ai]=true; const got=earn(15,20); toast(`+${got} 🪙 for your art!`); } } else say('Keep going — make it bigger! ✏️'); return; }
    const want=new Set(target.map(key)), have=new Set(drawn.map(key));
    const ok=want.size===have.size&&[...want].every(k=>have.has(k));
    if(ok){ const first=!S.artDone[ai]; S.artDone[ai]=true; const got=earn(first?20:3,20); say('PERFECT! You coded a drawing! 🎉');
      setTimeout(()=>{ if(dead) return; $('#ov').innerHTML=`<div class="overlay"><div class="card result-card"><div class="cel-burst"></div><h2>🎨 Perfect drawing!</h2><div class="earned">+${got} 🪙</div><div class="row center"><button class="btn ghost" id="again">Draw again</button><button class="btn green" id="next">Next ➡️</button></div></div></div>`;
        $('#again').onclick=()=>go('art',ai); $('#next').onclick=()=>go('art',Math.min(ART.length-1,ai+1)); },600); }
    else say(have.size>want.size?'Oops, a little too much! Match the dotted lines exactly.':'Not quite yet — follow the dotted lines! You can do it 💪');
  };
  const stop=loop((dt,t)=>{
    ctx.fillStyle='#fffdf6'; ctx.fillRect(0,0,VW,VH);
    ctx.fillStyle='#e4dccb'; for(let i=0;i<=N;i++) for(let j=0;j<=N;j++){ ctx.beginPath(); ctx.arc(G/2+i*G,G/2+j*G,2,0,7); ctx.fill(); }
    ctx.setLineDash([6,8]); ctx.strokeStyle='rgba(123,63,228,.45)'; ctx.lineWidth=6; ctx.lineCap='round';
    for(const s of target){ ctx.beginPath(); ctx.moveTo(G/2+s.x1*G,G/2+s.y1*G); ctx.lineTo(G/2+s.x2*G,G/2+s.y2*G); ctx.stroke(); }
    ctx.setLineDash([]);
    for(const s of drawn){ s.p=Math.min(1,s.p+dt*5); ctx.strokeStyle=s.c; ctx.lineWidth=8; ctx.beginPath(); ctx.moveTo(G/2+s.x1*G,G/2+s.y1*G); ctx.lineTo(G/2+(s.x1+(s.x2-s.x1)*s.p)*G,G/2+(s.y1+(s.y2-s.y1)*s.p)*G); ctx.stroke(); }
    turtle.px+=(turtle.x-turtle.px)*Math.min(1,dt*10); turtle.py+=(turtle.y-turtle.py)*Math.min(1,dt*10);
    let dd=turtle.d*Math.PI/4-turtle.pd; while(dd>Math.PI) dd-=2*Math.PI; while(dd<-Math.PI) dd+=2*Math.PI; turtle.pd+=dd*Math.min(1,dt*10);
    drawTurtle(ctx,G/2+turtle.px*G,G/2+turtle.py*G,turtle.pd,t);
  });
  cleanup=()=>{ dead=true; stop(); };
};
function drawTurtle(ctx,x,y,ang,t){
  ctx.save(); ctx.translate(x,y); ctx.rotate(ang);
  ctx.fillStyle='rgba(0,0,0,.15)'; ctx.beginPath(); ctx.ellipse(2,3,14,16,0,0,7); ctx.fill();
  const leg=Math.sin(t*10)*2; ctx.fillStyle='#7ed36b'; for(const [lx,ly] of [[-11,-8],[11,-8],[-11,8],[11,8]]){ ctx.beginPath(); ctx.ellipse(lx,ly+(lx*ly>0?leg:-leg),5,4,0,0,7); ctx.fill(); }
  ctx.beginPath(); ctx.arc(0,-17,6.5,0,7); ctx.fill(); ctx.fillStyle='#1a1020'; ctx.beginPath(); ctx.arc(-2.5,-19,1.3,0,7); ctx.arc(2.5,-19,1.3,0,7); ctx.fill();
  const g=ctx.createRadialGradient(-3,-4,2,0,0,14); g.addColorStop(0,'#5cc96b'); g.addColorStop(1,'#2f8f45'); ctx.fillStyle=g; ctx.beginPath(); ctx.ellipse(0,0,12,14,0,0,7); ctx.fill();
  ctx.strokeStyle='#1f6b33'; ctx.lineWidth=1.2; ctx.beginPath(); for(let i=0;i<6;i++){ const a=i/6*6.28; ctx.lineTo(Math.cos(a)*5,Math.sin(a)*6); } ctx.closePath(); ctx.stroke();
  ctx.fillStyle='#ff5fa2'; ctx.beginPath(); ctx.moveTo(-2,13); ctx.lineTo(2,13); ctx.lineTo(0,19); ctx.fill();
  ctx.restore();
}

    for(const b of balloons){
      ctx.strokeStyle='rgba(80,60,90,.6)'; ctx.lineWidth=1.2; ctx.beginPath(); ctx.moveTo(b.x,b.y+b.r*1.15); for(let i=0;i<5;i++) ctx.quadraticCurveTo(b.x+(i%2?8:-8)+Math.sin(t*3+b.ph)*3,b.y+b.r*1.15+i*10+5,b.x,b.y+b.r*1.15+(i+1)*10); ctx.stroke();
      const col=b.gold?'#ffcc1a':b.c; const g=ctx.createRadialGradient(b.x-b.r*.35,b.y-b.r*.4,b.r*.1,b.x,b.y,b.r*1.2); g.addColorStop(0,shade(col,70)); g.addColorStop(.5,col); g.addColorStop(1,shade(col,-50));
      ctx.fillStyle=g; ctx.beginPath(); ctx.ellipse(b.x,b.y,b.r,b.r*1.15,0,0,7); ctx.fill();
      ctx.fillStyle=shade(col,-40); ctx.beginPath(); ctx.moveTo(b.x-5,b.y+b.r*1.2); ctx.lineTo(b.x+5,b.y+b.r*1.2); ctx.lineTo(b.x,b.y+b.r*1.08); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.55)'; ctx.beginPath(); ctx.ellipse(b.x-b.r*.38,b.y-b.r*.45,b.r*.16,b.r*.3,.5,0,7); ctx.fill();
      if(b.gold) star(ctx,b.x,b.y,b.r*.4,'#fff7c2');
    }
    parts.forEach(p=>drawParticle(ctx,p));
    ctx.font='800 26px Fredoka,sans-serif'; ctx.textAlign='center'; for(const p of pops){ ctx.globalAlpha=Math.min(1,p.life*2); ctx.lineWidth=5; ctx.strokeStyle='rgba(60,20,80,.7)'; ctx.strokeText(p.text,p.x,p.y); ctx.fillStyle=p.color; ctx.fillText(p.text,p.x,p.y); } ctx.globalAlpha=1;
    ctx.fillStyle='rgba(30,20,60,.6)'; rr(ctx,12,12,300,42,21); ctx.fill(); ctx.fillStyle='#fff'; ctx.textAlign='left'; ctx.font='600 20px Fredoka,sans-serif'; ctx.fillText(`🎈 ${score}      ⏱ ${Math.ceil(timeLeft)}s`,30,40);
  });
  cleanup=stop;
};

/* =========================================================
   GAME 9: MEMORY MATCH
   ========================================================= */
SCREENS.memory=(diff)=>{
  const MODES={ easy:{pairs:6,cols:4,label:'🐣 Easy'}, medium:{pairs:8,cols:4,label:'🐥 Medium'}, hard:{pairs:10,cols:5,label:'🦅 Hard'} };
  if(!diff){
    app.innerHTML=`<div class="row"><button class="btn ghost small" id="back">← Home</button><h1>🃏 Memory Match</h1></div>
    <p class="muted" style="margin-top:0">Flip two cards at a time. Find all the matching pairs!</p>
    <div class="mem-modes">${Object.entries(MODES).map(([k,m])=>`<button class="game-card g${k==='easy'?3:k==='medium'?2:1}" data-m="${k}"><span class="emo">${m.label.split(' ')[0]}</span><h2>${m.label.split(' ')[1]}</h2><p>${m.pairs} pairs${S.best['mem_'+k]?` · Best: ${S.best['mem_'+k]} moves`:''}</p></button>`).join('')}</div>`;
    $('#back').onclick=()=>go('hub'); $$('[data-m]').forEach(b=>b.onclick=()=>go('memory',b.dataset.m)); return;
  }
  const M=MODES[diff];
  const EMO=['🐱','🐶','🦄','🍦','🌈','⭐','🍓','🐸','🦋','🌸','🎈','🍩','🐼','🚀','🧁','🐠'];
  const faces=[...EMO].sort(()=>Math.random()-.5).slice(0,M.pairs);
  const deck=[...faces,...faces].sort(()=>Math.random()-.5);
  app.innerHTML=`<div class="row"><button class="btn ghost small" id="back">← Modes</button><h1>🃏 Memory Match</h1><span class="pill-dark" id="mv">Moves: 0</span><span class="pill-dark" id="pr">Pairs: 0/${M.pairs}</span></div>
  <div class="mem-grid" style="--cols:${M.cols}">${deck.map((f,i)=>`<button class="mcard" data-i="${i}" aria-label="card"><div class="mi"><div class="mf back"><span>⭐</span></div><div class="mf front"><span>${f}</span></div></div></button>`).join('')}</div>`;
  $('#back').onclick=()=>go('memory');
  let open=[], moves=0, found=0, lock=false;
  $$('.mcard').forEach(c=>c.onclick=()=>{
    if(lock||c.classList.contains('flip')||c.classList.contains('done')) return;
    c.classList.add('flip'); open.push(c);
    if(open.length===2){ moves++; $('#mv').textContent='Moves: '+moves; lock=true;
      const [a,b]=open;
      if(deck[a.dataset.i]===deck[b.dataset.i]){ setTimeout(()=>{ a.classList.add('done'); b.classList.add('done'); open=[]; lock=false; found++; $('#pr').textContent=`Pairs: ${found}/${M.pairs}`;
          if(found===M.pairs){ const great=moves<=M.pairs*1.6; const best=S.best['mem_'+diff]; if(!best||moves<best) S.best['mem_'+diff]=moves;
            const got=earn(M.pairs*2+(great?6:0),15+M.pairs*2);
            setTimeout(()=>celebrate('🃏 You found them all!',`${moves} moves${great?' — amazing memory! 🧠':''} · +${got} 🪙`),400); } },350); }
      else setTimeout(()=>{ a.classList.remove('flip'); b.classList.remove('flip'); open=[]; lock=false; },850);
    }
  });
};

let shopTab='style';
SCREENS.shop=(tab)=>{
  if(tab) shopTab=tab;
  app.innerHTML=`<div class="row"><button class="btn ghost small" id="back">← Home</button><h1>🛍️ Shop</h1></div>
  <p class="muted" style="margin-top:0">Better blocks make better obbies, and better obbies give you more coins! Level up to earn even more from everything.</p>
  <div class="tabs"><button class="tab" data-t="style">👗 Avatar</button><button class="tab" data-t="blocks">🧱 Obby Blocks</button><button class="tab" data-t="city">🏙️ City</button><button class="tab" data-t="forest">🌲 Forest</button></div>
  <div id="grid"></div>`;
  $('#back').onclick=()=>go('hub');
  const card=(pic,name,desc,price,own,onBuy,onWear)=>{
    const c=document.createElement('div'); c.className='card item'+(own?' owned':'');
    c.appendChild(pic);
    c.insertAdjacentHTML('beforeend',`<b>${name}</b>${desc?`<div class="desc muted">${desc}</div>`:''}`);
    const btn=document.createElement('button');
    if(own){ btn.className='btn small ghost'; btn.textContent=onWear?'👗 Wear it':'✓ Owned'; btn.disabled=!onWear; if(onWear) btn.onclick=onWear; }
    else { btn.className='btn small pink'; btn.textContent=`Buy · ${price} 🪙`; btn.disabled=S.coins<price; btn.onclick=onBuy; }
    c.appendChild(btn); return c;
  };
  const render=()=>{
    $$('.tab').forEach(t=>t.classList.toggle('on',t.dataset.t===shopTab));
    const box=$('#grid'); box.innerHTML='';
    if(shopTab==='style'){
      for(const [slot,grp] of Object.entries(STYLE)){
        const list=Object.entries(grp.items).filter(([,it])=>it.price>0).sort((x,y)=>x[1].price-y[1].price);
        if(!list.length) continue;
        box.insertAdjacentHTML('beforeend',`<h3 class="shop-h">${grp.label}</h3>`);
        const g=document.createElement('div'); g.className='shop-grid'; box.appendChild(g);
        for(const [id,it] of list){
          const own=ownsStyle(slot,id), worn=S.avatar[slot]===id;
          g.appendChild(card(itemThumb(slot,id,S.avatar,84),it.name,'',it.price,own,
            ()=>{ if(S.coins<it.price) return; S.coins-=it.price; S.owned.style.push(slot+':'+id); S.avatar[slot]=id; save(); toast(`You got ${it.name} — you're wearing it now! 🎉`); render(); },
            worn?null:()=>{ S.avatar[slot]=id; save(); toast(`Now wearing ${it.name} ✨`); render(); }));
        }
      }
      return;
    }
    const g=document.createElement('div'); g.className='shop-grid'; box.appendChild(g);
    const cat=CATS[shopTab];
    Object.entries(cat).filter(([,it])=>it.price>0).sort((x,y)=>x[1].price-y[1].price).forEach(([id,it])=>{
      let pic;
      if(shopTab==='blocks') pic=miniCanvas(76,c=>{ const gr=c.createLinearGradient(0,0,0,76); gr.addColorStop(0,'#bfe6ff'); gr.addColorStop(1,'#eaf7ff'); c.fillStyle=gr; c.fillRect(0,0,76,76); drawBlock(c,id,14,16,.6,48); });
      else if(shopTab==='city') pic=miniCanvas(76,c=>{ c.fillStyle='#7ed36b'; c.fillRect(0,0,76,76); drawCity(c,{t:id,c:'#7aa8ff'},id==='tower'?20:14,id==='tower'?28:14,id==='tower'?36:48,0); });
      else pic=miniCanvas(76,c=>{ c.fillStyle='#5aa457'; c.fillRect(0,0,76,76); drawForest(c,{t:id},14,16,48,0,1,1); });
      g.appendChild(card(pic,it.name,it.desc||'',it.price,owns(shopTab,id),()=>{ if(S.coins<it.price) return; S.coins-=it.price; S.owned[shopTab].push(id); save(); toast(`You got ${it.name}! 🎉`); render(); }));
    });
  };
  $$('.tab').forEach(t=>t.onclick=()=>{ shopTab=t.dataset.t; render(); });
  render();
};

/* floating shapes behind the menus */
(function bgfx(){
  const c=document.getElementById('bgfx'), x=c.getContext('2d');
  const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W,H; const fit=()=>{ W=c.width=innerWidth; H=c.height=innerHeight; }; fit(); addEventListener('resize',fit);
  const shapes=Array.from({length:26},(_,i)=>({x:Math.random(),y:Math.random(),r:6+Math.random()*16,s:.01+Math.random()*.025,k:i%4,c:['#ff5fa2','#7b3fe4','#4fa3ff','#ffd23f','#3ec46d'][i%5],ph:Math.random()*6}));
  const step=t=>{ t/=1000; x.clearRect(0,0,W,H);
    for(const s of shapes){ const yy=((s.y-t*s.s)%1+1)%1*(H+60)-30, xx=s.x*W+Math.sin(t*.6+s.ph)*24; x.globalAlpha=.13;
      if(s.k===0){ x.fillStyle=s.c; x.beginPath(); x.arc(xx,yy,s.r,0,7); x.fill(); }
      else if(s.k===1) star(x,xx,yy,s.r,s.c);
      else if(s.k===2){ x.fillStyle=s.c; heartPath(x,xx,yy-s.r,s.r*2); x.fill(); }
      else { x.save(); x.translate(xx,yy); x.rotate(t*.4+s.ph); x.fillStyle=s.c; x.fillRect(-s.r*.7,-s.r*.7,s.r*1.4,s.r*1.4); x.restore(); } }
    x.globalAlpha=1; if(!still) requestAnimationFrame(step); };
  requestAnimationFrame(step);
})();
if(S.avatar) dailyBonus();
go(S.avatar?'hub':'pick');
